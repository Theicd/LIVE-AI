<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Horizon | 3D Experience</title>
    <style>
        /* CSS Reset & Basic Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background-color: #050510; /* Fallback color */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
        }

        /* 3D Canvas Container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            outline: none;
        }

        /* UI Overlay Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none; /* Let clicks pass through to canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }

        /* Header / Title */
        header {
            text-align: center;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            animation: fadeInDown 1.5s ease-out;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #00f2ff, #bd00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 0.8rem;
            opacity: 0.7;
            letter-spacing: 0.1em;
        }

        /* Footer / Instructions */
        footer {
            text-align: center;
            pointer-events: auto; /* Enable interaction with buttons */
            animation: fadeInUp 1.5s ease-out;
        }

        .instruction-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }

        .instruction-card:active {
            transform: scale(0.95);
        }

        .key-icon {
            width: 24px;
            height: 24px;
            border: 2px solid white;
            border-radius: 50%;
            position: relative;
        }

        .key-icon::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 4px;
            background: white;
            transform: translate(-50%, -50%) rotate(45deg);
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loading Screen */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050510;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 242, 255, 0.3);
            border-top: 4px solid #00f2ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
    </div>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <header>
            <h1>Neon Horizon</h1>
            <p class="subtitle">Infinite Digital Landscape</p>
        </header>

        <footer>
            <div class="instruction-card">
                <div class="key-icon"></div>
                <span>Drag to Rotate &bull; Scroll to Zoom</span>
            </div>
        </footer>
    </div>

    <!-- 3D Container -->
    <div id="canvas-container"></div>

    <!-- Three.js Library (ES Module Import Map) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- Main Logic -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration ---
        const CONFIG = {
            terrainSize: 200,
            terrainSegments: 60, // High segment count for smooth hills
            speed: 0.15,
            colorTop: 0xbd00ff, // Purple
            colorBottom: 0x00f2ff, // Cyan
            fogDensity: 0.015,
            cameraHeight: 15,
            cameraAngle: 0.5
        };

        // --- Global Variables ---
        let scene, camera, renderer, controls;
        let terrainMesh, particles;
        let clock = new THREE.Clock();
        
        // --- Initialization ---
        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, CONFIG.fogDensity);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, CONFIG.cameraHeight, 20);

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimize for mobile
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 4. Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.1; // Prevent going below ground
            controls.minDistance = 5;
            controls.maxDistance = 50;
            // Limit vertical rotation for a "landscape" feel
            controls.minAzimuthAngle = -Math.PI / 4;
            controls.maxAzimuthAngle = Math.PI / 4;

            // 5. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 1);
            sunLight.position.set(50, 50, 50);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 1024;
            sunLight.shadow.mapSize.height = 1024;
            scene.add(sunLight);

            // Add a point light for the "Neon" feel near the camera
            const pointLight = new THREE.PointLight(CONFIG.colorBottom, 2, 50);
            pointLight.position.set(0, 10, 10);
            scene.add(pointLight);

            // 6. Create Objects
            createTerrain();
            createStars();

            // 7. Event Listeners
            window.addEventListener('resize', onWindowResize);

            // Remove loader
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 800);

            // Start Animation
            animate();
        }

        // --- Terrain Generation ---
        function createTerrain() {
            // Create a plane with many segments
            const geometry = new THREE.PlaneGeometry(
                CONFIG.terrainSize, 
                CONFIG.terrainSize, 
                CONFIG.terrainSegments, 
                CONFIG.terrainSegments
            );

            // Rotate to lay flat
            geometry.rotateX(-Math.PI / 2);

            // Modify vertices to create hills (using sine waves for procedural generation)
            const count = geometry.attributes.position.count;
            const positionAttribute = geometry.attributes.position;
            
            // Simple pseudo-random noise using sin/cos
            for (let i = 0; i < count; i++) {
                const x = positionAttribute.getX(i);
                const z = positionAttribute.getZ(i);
                
                // Combine multiple sine waves for organic look
                const y = 
                    Math.sin(x * 0.05) * 2 + 
                    Math.cos(z * 0.05) * 2 +
                    Math.sin(x * 0.1 + z * 0.1) * 1 +
                    Math.cos(x * 0.2) * 0.5;

                // Raise the center slightly
                const dist = Math.sqrt(x*x + z*z);
                const centerRise = Math.max(0, (20 - dist) * 0.5);

                positionAttribute.setY(i, y + centerRise);
            }

            geometry.computeVertexNormals();

            // Create material - Wireframe aesthetic
            const material = new THREE.MeshStandardMaterial({
                color: 0x111111,
                emissive: CONFIG.colorBottom,
                emissiveIntensity: 0.2,
                wireframe: true,
                roughness: 0.5,
                metalness: 0.8
            });

            terrainMesh = new THREE.Mesh(geometry, material);
            scene.add(terrainMesh);
        }

        // --- Particle System (Stars/Dust) ---
        function createStars() {
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 1500;
            const posArray = new Float32Array(particlesCount * 3);

            for(let i = 0; i < particlesCount * 3; i++) {
                // Spread particles in a wide area
                posArray[i] = (Math.random() - 0.5) * 300; 
            }

            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

            const particlesMaterial = new THREE.PointsMaterial({
                size: 0.3,
                color: 0xffffff,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particles);
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            // 1. Move Terrain to simulate flight
            // We modify the Z position of the mesh
            terrainMesh.position.z = (time * CONFIG.speed) % (CONFIG.terrainSize / CONFIG.terrainSegments);

            // 2. Animate Particles (Starfield effect)
            particles.rotation.y = time * 0.02;
            particles.position.z = (time * CONFIG.speed * 0.5) % 50;

            // 3. Subtle Camera Movement (Idle animation)
            // This adds life when the user isn't touching the screen
            camera.position.x += Math.sin(time * 0.5) * 0.02;
            camera.lookAt(0, 0, -20);

            controls.update();
            renderer.render(scene, camera);
        }

        // --- Resize Handler ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Initialize when DOM is ready
        init();
    </script>
</body>
</html>
