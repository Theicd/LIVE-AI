<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Aether Core | Interactive Experience</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Prevent scroll bars */
            width: 100vw;
            height: 100vh;
        }

        /* Canvas Container */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            outline: none;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            z-index: 2;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.4) 100%);
        }

        /* Header */
        header {
            text-align: center;
            opacity: 0;
            animation: fadeIn 2s ease-out forwards;
        }

        h1 {
            font-weight: 200;
            letter-spacing: 0.3em;
            font-size: 1.2rem;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-weight: 300;
            font-size: 0.8rem;
            color: #a0a0a0;
            letter-spacing: 0.1em;
        }

        /* Footer / Instructions */
        footer {
            text-align: center;
            pointer-events: auto; /* Re-enable pointer for specific footer interactions if needed */
            opacity: 0;
            animation: fadeIn 2s ease-out 1s forwards;
        }

        .instruction {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            display: inline-block;
        }

        .instruction:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        /* Loading Screen */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease-out;
        }

        .loader-text {
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            animation: pulse 1.5s infinite;
        }

        /* Animations */
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; text-shadow: 0 0 10px rgba(0, 255, 255, 0.8); }
            100% { opacity: 0.4; }
        }
    </style>
    
    <!-- Import Map for Three.js and Addons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="loader-text">INITIALIZING CORE...</div>
    </div>

    <!-- UI Layer -->
    <div id="ui-layer">
        <header>
            <h1>Aether Core</h1>
            <p class="subtitle">Procedural Neural Interface</p>
        </header>
        
        <footer>
            <div class="instruction">Drag to rotate &bull; Scroll to zoom &bull; Double click to pulse</div>
        </footer>
    </div>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- Main Logic -->
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- Configuration ---
        const config = {
            particleCount: 20000,
            coreColor: new THREE.Color(0x00ffff),
            shellColor: new THREE.Color(0xff00ff),
            bgStars: 3000,
            bloomStrength: 1.5,
            bloomRadius: 0.4,
            bloomThreshold: 0,
            rotationSpeed: 0.05
        };

        // --- State ---
        let scene, camera, renderer, composer;
        let particleSystem, coreGeometry;
        let clock = new THREE.Clock();
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0, targetRotationY = 0;
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let pulseScale = 1;

        // --- Shaders ---
        
        // Vertex Shader: Handles particle position and movement logic
        const vertexShader = `
            uniform float uTime;
            uniform float uPulse;
            attribute float aScale;
            attribute vec3 aRandom;
            
            varying vec3 vColor;
            
            // Simplex Noise Function (simplified)
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
            float snoise(vec3 v) {
                const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy));
                vec3 x0 = v - i + dot(i, C.xxx);
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute( permute( permute(
                            i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 0.142857142857;
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x;
                p1 *= norm.y;
                p2 *= norm.z;
                p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }

            void main() {
                vec3 pos = position;
                
                // Add noise-based organic movement
                float noiseVal = snoise(pos * 0.5 + uTime * 0.5);
                
                // Displace vertices outwards
                pos += normal * noiseVal * 0.4;
                
                // Pulse effect
                pos *= (1.0 + uPulse * 0.2);

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                
                // Size attenuation based on depth
                gl_PointSize = aScale * (300.0 / -mvPosition.z);
                
                // Color variation based on position and noise
                vColor = mix(vec3(0.0, 1.0, 1.0), vec3(1.0, 0.0, 1.0), noiseVal * 0.5 + 0.5);
                
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        // Fragment Shader: Draws the particle shape and glow
        const fragmentShader = `
            uniform float uSize;
            varying vec3 vColor;
            
            void main() {
                // Create a circular soft particle
                vec2 coord = gl_PointCoord - vec2(0.5);
                float dist = length(coord);
                
                if (dist > 0.5) discard;
                
                // Soft edge
                float alpha = 1.0 - smoothstep(0.3, 0.5, dist);
                
                gl_FragColor = vec4(vColor, alpha);
            }
        `;

        function init() {
            // 1. Scene Setup
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            // Fog for depth fading
            scene.fog = new THREE.FogExp2(0x050505, 0.002);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimize for mobile
            renderer.toneMapping = THREE.ReinhardToneMapping;
            container.appendChild(renderer.domElement);

            // 2. Core Particle System (The "Brain")
            createCore();

            // 3. Shells/Rings (The "Shield")
            createShells();

            // 4. Background Stars
            createStars();

            // 5. Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 2, 100);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);
            
            const pointLight2 = new THREE.PointLight(config.coreColor, 3, 100);
            pointLight2.position.set(-10, -10, 10);
            scene.add(pointLight2);

            // 6. Post-Processing (Bloom)
            const renderScene = new RenderPass(scene, camera);
            
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                config.bloomStrength,
                config.bloomRadius,
                config.bloomThreshold
            );

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // 7. Event Listeners
            document.addEventListener('mousemove', onDocumentMouseMove, false);
            document.addEventListener('touchmove', onTouchMove, { passive: false });
            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('dblclick', triggerPulse);
            
            // Pointer events for drag logic
            document.addEventListener('pointerdown', onPointerDown);
            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);

            // Remove Loader
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 1000);
            }, 1000);
        }

        function createCore() {
            // Create an Icosahedron base for the sphere shape
            const geometry = new THREE.IcosahedronGeometry(10, 4); // Radius 10, detail 4
            
            // Add custom attributes for shader
            const positions = geometry.attributes.position;
            const randoms = new Float32Array(positions.count);
            const scales = new Float32Array(positions.count);
            
            for (let i = 0; i < positions.count; i++) {
                randoms[i] = Math.random();
                scales[i] = Math.random() * 0.5 + 0.5;
            }
            
            geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 3));
            geometry.setAttribute('aScale', new THREE.BufferAttribute(scales, 1));
            geometry.setAttribute('normal', geometry.attributes.position); // Use position as normal for spherical noise

            // Create custom material
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uPulse: { value: 0 }
                },
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
            coreGeometry = geometry;
        }

        function createShells() {
            // Outer rotating structure
            const geo1 = new THREE.IcosahedronGeometry(18, 1);
            const mat1 = new THREE.MeshBasicMaterial({ 
                color: config.shellColor, 
                wireframe: true, 
                transparent: true, 
                opacity: 0.1,
                blending: THREE.AdditiveBlending
            });
            const shell1 = new THREE.Mesh(geo1, mat1);
            scene.add(shell1);

            // Secondary Ring
            const geo2 = new THREE.TorusGeometry(22, 0.2, 16, 100);
            const mat2 = new THREE.MeshBasicMaterial({ color: 0x0044ff, wireframe: true, transparent: true, opacity: 0.05 });
            const shell2 = new THREE.Mesh(geo2, mat2);
            shell2.rotation.x = Math.PI / 2;
            scene.add(shell2);
            
            // Keep references for animation
            particleSystem.userData.shells = [shell1, shell2];
        }

        function createStars() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            
            for (let i = 0; i < config.bgStars; i++) {
                const x = (Math.random() - 0.5) * 200;
                const y = (Math.random() - 0.5) * 200;
                const z = (Math.random() - 0.5) * 200;
                vertices.push(x, y, z);
            }
            
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            
            const material = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.5,
                transparent: true,
                opacity: 0.6
            });
            
            const stars = new THREE.Points(geometry, material);
            scene.add(stars);
            particleSystem.userData.stars = stars;
        }

        // --- Interaction Logic ---

        function onWindowResize() {
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function onPointerDown(e) {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        }

        function onPointerMove(e) {
            if (isDragging) {
                const deltaMove = {
                    x: e.clientX - previousMousePosition.x,
                    y: e.clientY - previousMousePosition.y
                };

                // Directly rotate the scene wrapper or camera orbit
                // Here we rotate the whole scene group for easier control
                scene.rotation.y += deltaMove.x * 0.005;
                scene.rotation.x += deltaMove.y * 0.005;

                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        }

        function onPointerUp() {
            isDragging = false;
        }

        function onDocumentMouseMove(event) {
            mouseX = (event.clientX - windowHalfX) * 0.001;
            mouseY = (event.clientY - windowHalfY) * 0.001;
        }
        
        function onTouchMove(event) {
            if(event.touches.length === 1) {
                // Prevent default to stop scrolling/zooming
                event.preventDefault();
                const touch = event.touches[0];
                mouseX = (touch.clientX - windowHalfX) * 0.001;
                mouseY = (touch.clientY - windowHalfY) * 0.001;
            }
        }

        function triggerPulse() {
            // Animation loop handles the decay of uPulse
            particleSystem.material.uniforms.uPulse.value = 3.0; // Spike the pulse
        }

        // --- Animation Loop ---

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // 1. Update Uniforms
            // Decay pulse effect
            const pulse = particleSystem.material.uniforms.uPulse.value;
            particleSystem.material.uniforms.uPulse.value = Math.max(0, pulse - 0.05);
            
            particleSystem.material.uniforms.uTime.value = elapsedTime;

            // 2. Smooth Camera/Object Rotation (Parallax)
            // Even without dragging, the scene breathes slightly
            if (!isDragging) {
                scene.rotation.y += 0.002;
                scene.rotation.x += (mouseY * 0.5 - scene.rotation.x) * 0.05;
                scene.rotation.z += (mouseX * 0.5 - scene.rotation.z) * 0.05;
            }

            // 3. Rotate Shells
            if (particleSystem.userData.shells) {
                particleSystem.userData.shells[0].rotation.y -= 0.001;
                particleSystem.userData.shells[0].rotation.x -= 0.001;
                particleSystem.userData.shells[1].rotation.z += 0.002;
            }

            // 4. Rotate Stars
            if (particleSystem.userData.stars) {
                particleSystem.userData.stars.rotation.y = elapsedTime * 0.02;
            }

            // 5. Render
            composer.render();
        }

        // Boot
        init();
        animate();

    </script>
</body>
</html>
