<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethereal Weaver - Interactive 3D Experience</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #050508;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
        }

        #canvas-container {
            width: 800px;
            height: 800px;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a0a1a 0%, #000000 100%);
        }

        canvas {
            display: block;
            outline: none;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            box-sizing: border-box;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        h1 {
            font-size: 24px;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #00f2ff, #bd00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
        }

        .status {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            text-align: right;
        }

        .controls {
            pointer-events: auto;
            text-align: right;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
        }

        .btn:hover {
            background: rgba(0, 242, 255, 0.2);
            border-color: #00f2ff;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
        }

        .instruction {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            text-transform: uppercase;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }

        /* Loading Overlay */
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1s ease;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 242, 255, 0.3);
            border-top: 4px solid #00f2ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    
    <!-- Import Maps for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-container">
        <div id="loader"><div class="spinner"></div></div>
        <div id="ui-layer">
            <div class="header">
                <div>
                    <h1>Ethereal Weaver</h1>
                    <div style="font-size: 10px; color: #888; margin-top: 4px;">Procedural Neural Core</div>
                </div>
                <div class="status">
                    <div id="fps-counter">60 FPS</div>
                    <div id="entity-count">Entities: 0</div>
                </div>
            </div>
            
            <div class="controls">
                <button class="btn" id="regen-btn">Re-Genesis</button>
            </div>

            <div class="instruction">
                Move mouse to rotate • Click to Pulse
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- Configuration & State ---
        const config = {
            width: 800,
            height: 800,
            particleCount: 60,
            connectionDistance: 3.5,
            rotationSpeed: 0.001,
            colors: [
                new THREE.Color('#00f2ff'), // Cyan
                new THREE.Color('#bd00ff'), // Purple
                new THREE.Color('#ff0055'), // Magenta
                new THREE.Color('#ffffff')  // White
            ]
        };

        let scene, camera, renderer, composer;
        let coreGroup;
        let particles = [];
        let linesMesh;
        let time = 0;
        let pulseIntensity = 0;
        
        // Mouse interaction
        const mouse = new THREE.Vector2();
        const targetRotation = new THREE.Vector2();
        const windowHalf = new THREE.Vector2(config.width / 2, config.height / 2);

        // --- Initialization ---
        function init() {
            const container = document.getElementById('canvas-container');

            // Scene setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050508, 0.02);

            // Camera
            camera = new THREE.PerspectiveCamera(60, config.width / config.height, 0.1, 100);
            camera.position.z = 12;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(config.width, config.height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Limit pixel ratio for performance
            renderer.setClearColor(0x050508);
            container.appendChild(renderer.domElement);

            // Post-Processing (Bloom)
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(config.width, config.height), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0;
            bloomPass.strength = 1.2; // High bloom for "Breathtaking" look
            bloomPass.radius = 0.5;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambientLight);

            // Create the Experience
            createExperience();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('click', onClick);
            document.getElementById('regen-btn').addEventListener('click', regenerate);

            // Hide loader
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 1000);
            }, 800);

            animate();
        }

        // --- Core Generation Logic ---
        function createExperience() {
            // Clear previous scene content if any
            while(scene.children.length > 0){ 
                scene.remove(scene.children[0]); 
            }
            // Re-add basic scene stuff
            scene.fog = new THREE.FogExp2(0x050508, 0.02);
            
            coreGroup = new THREE.Group();
            scene.add(coreGroup);

            // 1. Create Central Core
            const coreGeo = new THREE.IcosahedronGeometry(1.5, 0);
            const coreMat = new THREE.MeshBasicMaterial({ 
                color: 0x00f2ff, 
                wireframe: true,
                transparent: true,
                opacity: 0.8
            });
            const coreMesh = new THREE.Mesh(coreGeo, coreMat);
            coreGroup.add(coreMesh);

            // Inner glowing core
            const innerGeo = new THREE.IcosahedronGeometry(0.8, 1);
            const innerMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const innerMesh = new THREE.Mesh(innerGeo, innerMat);
            coreGroup.add(innerMesh);

            // 2. Create Orbiting Particles
            const geometry = new THREE.SphereGeometry(0.1, 8, 8);
            const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
            
            for (let i = 0; i < config.particleCount; i++) {
                const mesh = new THREE.Mesh(geometry, material.clone());
                
                // Random spherical distribution
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                const r = 3 + Math.random() * 5; // Distance from center

                mesh.position.x = r * Math.sin(phi) * Math.cos(theta);
                mesh.position.y = r * Math.sin(phi) * Math.sin(theta);
                mesh.position.z = r * Math.cos(phi);

                // Store metadata for animation
                const particle = {
                    mesh: mesh,
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.02,
                        (Math.random() - 0.5) * 0.02,
                        (Math.random() - 0.5) * 0.02
                    ),
                    orbitSpeed: 0.005 + Math.random() * 0.01,
                    orbitAxis: new THREE.Vector3(Math.random(), Math.random(), Math.random()).normalize(),
                    baseColor: config.colors[Math.floor(Math.random() * config.colors.length)],
                    radius: r,
                    angle: Math.random() * Math.PI * 2
                };
                
                mesh.material.color = particle.baseColor;
                coreGroup.add(mesh);
                particles.push(particle);
            }

            // 3. Create Connection Lines
            // We use a BufferGeometry where we update vertices every frame
            const lineCount = config.particleCount * 2; // Max possible lines
            const lineGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(lineCount * 3);
            const colors = new Float32Array(lineCount * 3);
            
            lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const lineMat = new THREE.LineBasicMaterial({
                vertexColors: true,
                transparent: true,
                opacity: 0.3,
                blending: THREE.AdditiveBlending
            });
            
            linesMesh = new THREE.LineSegments(lineGeo, lineMat);
            coreGroup.add(linesMesh);

            // Update UI
            document.getElementById('entity-count').innerText = `Entities: ${config.particleCount + 1}`;
        }

        function regenerate() {
            // Visual feedback
            pulseIntensity = 2.0; // Big burst
            createExperience();
        }

        // --- Interaction Handlers ---
        function onMouseMove(event) {
            // Normalize mouse position relative to center of canvas
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        }

        function onClick() {
            pulseIntensity = 1.0; // Standard pulse
        }

        function onWindowResize() {
            // The canvas is fixed at 800x800 in CSS, but we handle resizing logic just in case
            // For this specific prompt, we keep the internal resolution 800x800
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            time += 0.01;
            pulseIntensity *= 0.95; // Decay pulse

            // 1. Rotate the entire group based on mouse
            targetRotation.x = mouse.y * 0.5;
            targetRotation.y = mouse.x * 0.5;
            
            coreGroup.rotation.x += (targetRotation.x - coreGroup.rotation.x) * 0.05;
            coreGroup.rotation.y += (targetRotation.y - coreGroup.rotation.y) * 0.05;

            // 2. Animate Particles
            const positions = linesMesh.geometry.attributes.position.array;
            const colors = linesMesh.geometry.attributes.color.array;
            let lineVertexIndex = 0;

            const coreSpeed = 0.002 + (pulseIntensity * 0.01);

            particles.forEach((p, i) => {
                // Orbit logic
                p.angle += p.orbitSpeed;
                const x = Math.cos(p.angle) * p.radius;
                const y = Math.sin(p.angle) * p.radius;
                
                // Add some wobble
                p.mesh.position.x = x + Math.sin(time + i) * 0.5;
                p.mesh.position.y = y + Math.cos(time + i * 0.5) * 0.5;
                p.mesh.position.z = Math.sin(time * 0.5 + i) * p.radius;

                // Rotate individual particles
                p.mesh.rotation.x += 0.01;
                p.mesh.rotation.y += 0.02;

                // Check connections
                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dist = p.mesh.position.distanceTo(p2.mesh.position);

                    if (dist < config.connectionDistance) {
                        // Add line segment
                        if (lineVertexIndex < positions.length) {
                            // Start point
                            positions[lineVertexIndex++] = p.mesh.position.x;
                            positions[lineVertexIndex++] = p.mesh.position.y;
                            positions[lineVertexIndex++] = p.mesh.position.z;

                            // End point
                            positions[lineVertexIndex++] = p2.mesh.position.x;
                            positions[lineVertexIndex++] = p2.mesh.position.y;
                            positions[lineVertexIndex++] = p2.mesh.position.z;

                            // Color gradient based on distance
                            const alpha = 1 - (dist / config.connectionDistance);
                            
                            // Interpolate colors
                            const c1 = p.baseColor;
                            const c2 = p2.baseColor;
                            
                            colors[lineVertexIndex - 6] = c1.r;
                            colors[lineVertexIndex - 5] = c1.g;
                            colors[lineVertexIndex - 4] = c1.b;

                            colors[lineVertexIndex - 3] = c2.r;
                            colors[lineVertexIndex - 2] = c2.g;
                            colors[lineVertexIndex - 1] = c2.b;
                        }
                    }
                }
            });

            // Clear remaining line buffer (hide unused lines)
            for (let k = lineVertexIndex; k < positions.length; k++) {
                positions[k] = 0;
            }

            linesMesh.geometry.attributes.position.needsUpdate = true;
            linesMesh.geometry.attributes.color.needsUpdate = true;
            linesMesh.geometry.setDrawRange(0, lineVertexIndex / 3);

            // 3. Animate Core
            const core = coreGroup.children[0];
            const inner = coreGroup.children[1];
            
            core.rotation.y -= 0.005;
            core.rotation.z -= 0.002;
            
            // Pulse scale
            const scale = 1 + Math.sin(time * 2) * 0.05 + (pulseIntensity * 0.1);
            core.scale.set(scale, scale, scale);

            // Inner core spins faster
            inner.rotation.y += 0.02;

            // 4. Render
            composer.render();
        }

        // Start
        init();

    </script>
</body>
</html>
