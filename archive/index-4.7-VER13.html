<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Horizon | 3D Journey</title>
    <style>
        :root {
            --primary: #ffffff;
            --overlay: rgba(0, 0, 0, 0.4);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Container for the 9:16 aspect ratio */
        #canvas-container {
            width: 800px;
            height: 800px;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            border-radius: 4px;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            box-sizing: border-box;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.6) 100%);
        }

        .header {
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--primary);
            opacity: 0.9;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .status {
            margin-top: 10px;
            font-size: 14px;
            color: #a0a0a0;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .indicator {
            width: 8px;
            height: 8px;
            background-color: #00ffcc;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ffcc;
            animation: pulse 2s infinite;
        }

        .location {
            font-size: 18px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: opacity 0.5s ease;
            opacity: 0;
            transform: translateY(20px);
        }

        .location.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Cinematic Bars (Letterboxing) */
        .cinematic-bar {
            position: absolute;
            left: 0;
            width: 100%;
            height: 40px;
            background-color: #000;
            z-index: 10;
        }

        .bar-top { top: 0; }
        .bar-bottom { bottom: 0; }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.5; transform: scale(0.8); }
        }

        /* Vignette effect */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.7);
            pointer-events: none;
            z-index: 5;
        }
    </style>
    <!-- Import Three.js as a module -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-container">
        <!-- Cinematic Letterbox -->
        <div class="cinematic-bar bar-top"></div>
        <div class="cinematic-bar bar-bottom"></div>
        
        <!-- Vignette -->
        <div class="vignette"></div>

        <!-- UI -->
        <div id="ui-layer">
            <div class="header">
                <h1>Endless Horizon</h1>
                <div class="status">
                    <span class="indicator"></span>
                    <span>LIVE SIMULATION</span>
                </div>
            </div>
            <div>
                <div id="location-text" class="location">Loading Terrain...</div>
            </div>
        </div>

        <canvas id="webgl"></canvas>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // --- Configuration ---
        const CONFIG = {
            width: 800,
            height: 800,
            fov: 60,
            speed: 0.15,
            fogDensity: 0.008,
            terrainResolution: 256,
            terrainSize: 400,
            segments: 64,
            dayDuration: 60 // seconds for full cycle
        };

        // --- Global Variables ---
        let scene, camera, renderer;
        let terrainMesh, waterMesh, cloudsGroup, particleSystem;
        let uniforms;
        let clock = new THREE.Clock();
        let locationTimer = 0;
        let currentBiome = "Initializing";
        
        // Biome definitions for UI
        const BIOMES = [
            "Emerald Valley", "Sunset Pass", "Crystalline Lake", 
            "Desert Dunes", "Whispering Forest", "Abyssal Coast", 
            "Northern Tundra", "Mystic Peaks", "Azure Skyline"
        ];

        // --- GLSL Shaders ---

        // Simplex Noise Function (Standard GLSL implementation)
        const noiseGLSL = `
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
            float snoise(vec3 v) {
                const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute( permute( permute(
                            i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 0.142857142857;
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }
        `;

        // Terrain Vertex Shader
        const terrainVertexShader = `
            uniform float uTime;
            uniform float uSpeed;
            varying vec2 vUv;
            varying float vElevation;
            varying vec3 vNormal;
            varying vec3 vViewPosition;

            ${noiseGLSL}

            void main() {
                vUv = uv;
                vec3 pos = position;
                
                // Create movement illusion by offsetting noise based on time and UV.x
                float noiseFreq = 0.08;
                float noiseAmp = 15.0;
                
                // Scroll the terrain in the negative Z direction visually
                float scrollOffset = uTime * uSpeed;
                
                // Layered noise for detail
                float elevation = snoise(vec3(pos.x * noiseFreq, pos.y * noiseFreq, scrollOffset)) * noiseAmp;
                elevation += snoise(vec3(pos.x * 0.15, pos.y * 0.15, scrollOffset)) * (noiseAmp * 0.5);
                
                pos.z += elevation;
                vElevation = elevation;

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                vViewPosition = -mvPosition.xyz;
                gl_Position = projectionMatrix * mvPosition;
                
                // Recalculate normal approximation for lighting
                vec3 objectNormal = normalize(normalMatrix * normal);
                vNormal = normalize(normalMatrix * vec3(elevation, 0.0, 0.0) + objectNormal);
            }
        `;

        // Terrain Fragment Shader
        const terrainFragmentShader = `
            uniform vec3 uColorDeep;
            uniform vec3 uColorSand;
            uniform vec3 uColorGrass;
            uniform vec3 uColorRock;
            uniform vec3 uColorSnow;
            uniform vec3 uSunPosition;
            uniform float uDayTime; // 0.0 to 1.0

            varying float vElevation;
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vViewPosition;

            void main() {
                vec3 color = uColorDeep;
                
                // Color based on height
                float h = vElevation;
                
                if(h < -2.0) {
                    color = uColorDeep; // Water level (handled by water plane, but fallback)
                } else if(h < -0.5) {
                    color = mix(uColorDeep, uColorSand, smoothstep(-2.0, -0.5, h));
                } else if(h < 2.0) {
                    color = mix(uColorSand, uColorGrass, smoothstep(-0.5, 0.0, h));
                    // Add some noise variation for grass
                    float noise = sin(vUv.x * 50.0) * sin(vUv.y * 50.0) * 0.05;
                    color += noise;
                } else if(h < 5.0) {
                    color = mix(uColorGrass, uColorRock, smoothstep(2.0, 5.0, h));
                } else {
                    color = mix(uColorRock, uColorSnow, smoothstep(5.0, 7.0, h));
                }

                // Fake Shadows / Directional Lighting
                vec3 lightDir = normalize(uSunPosition);
                float diff = max(dot(vNormal, lightDir), 0.0);
                
                // Rim lighting / Ambient occlusion feel
                float viewDot = max(dot(normalize(vViewPosition), vNormal), 0.0);
                float rim = 1.0 - viewDot;
                rim = pow(rim, 3.0);

                // Day/Night cycle lighting
                float sunIntensity = 0.8 * diff;
                if(uDayTime > 0.6 || uDayTime < 0.2) {
                    sunIntensity *= 0.2; // Night
                }

                // Add rim light for "stunning" look
                vec3 finalColor = color * (0.4 + 0.6 * sunIntensity) + vec3(0.1) + rim * 0.3;

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        // Water Shader
        const waterVertexShader = `
            uniform float uTime;
            varying vec2 vUv;
            varying float vElevation;

            ${noiseGLSL}

            void main() {
                vUv = uv;
                vec3 pos = position;
                
                // Gentle waves
                float wave = sin(pos.x * 0.5 + uTime) * cos(pos.y * 0.3 + uTime) * 0.5;
                pos.z += wave;
                vElevation = wave;

                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        const waterFragmentShader = `
            uniform vec3 uColor;
            uniform float uTime;
            varying vec2 vUv;
            varying float vElevation;

            void main() {
                // Simple reflection simulation using sine waves
                float wave = sin(vUv.x * 20.0 + uTime * 2.0) * 0.5 + 0.5;
                float alpha = 0.6 + wave * 0.2;
                
                vec3 finalColor = mix(uColor, vec3(1.0), wave * 0.3); // Add sparkle
                gl_FragColor = vec4(finalColor, alpha);
            }
        `;

        // Particle System Shader
        const particleVertexShader = `
            attribute float size;
            attribute float speed;
            uniform float uTime;
            uniform float uSpeed;
            varying float vAlpha;

            void main() {
                vec3 pos = position;
                // Move particles down relative to camera
                pos.y -= uTime * speed * uSpeed * 20.0;
                
                // Reset if too low
                if(pos.y < -10.0) pos.y = 10.0;

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                gl_PointSize = size * (300.0 / -mvPosition.z);
                gl_Position = projectionMatrix * mvPosition;
                
                // Fade out based on distance
                vAlpha = 1.0 - smoothstep(0.0, 20.0, -mvPosition.z);
            }
        `;

        const particleFragmentShader = `
            varying float vAlpha;

            void main() {
                // Circular particle
                float r = distance(gl_PointCoord, vec2(0.5));
                if (r > 0.5) discard;
                
                // Soft edge
                float glow = 1.0 - (r * 2.0);
                glow = pow(glow, 1.5);

                gl_FragColor = vec4(0.8, 0.9, 1.0, vAlpha * glow);
            }
        `;

        // --- Initialization ---
        function init() {
            const container = document.getElementById('canvas-container');
            const canvas = document.getElementById('webgl');

            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, CONFIG.fogDensity);

            // Camera
            camera = new THREE.PerspectiveCamera(CONFIG.fov, CONFIG.width / CONFIG.height, 0.1, 1000);
            camera.position.set(0, 5, 10);
            camera.lookAt(0, 0, -20);

            // Renderer
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(CONFIG.width, CONFIG.height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // --- Terrain ---
            const geometry = new THREE.PlaneGeometry(CONFIG.terrainSize, CONFIG.terrainSize, CONFIG.segments, CONFIG.segments);
            geometry.rotateX(-Math.PI / 2);

            uniforms = {
                uTime: { value: 0 },
                uSpeed: { value: CONFIG.speed },
                uColorDeep: { value: new THREE.Color(0x1a5276) }, // Deep water/Shadow
                uColorSand: { value: new THREE.Color(0xf4d03f) },
                uColorGrass: { value: new THREE.Color(0x27ae60) },
                uColorRock: { value: new THREE.Color(0x7f8c8d) },
                uColorSnow: { value: new THREE.Color(0xffffff) },
                uSunPosition: { value: new THREE.Vector3(50, 50, -50) },
                uDayTime: { value: 0.5 }
            };

            const material = new THREE.ShaderMaterial({
                vertexShader: terrainVertexShader,
                fragmentShader: terrainFragmentShader,
                uniforms: uniforms
            });

            terrainMesh = new THREE.Mesh(geometry, material);
            scene.add(terrainMesh);

            // --- Water ---
            const waterGeo = new THREE.PlaneGeometry(CONFIG.terrainSize, CONFIG.terrainSize);
            waterGeo.rotateX(-Math.PI / 2);
            
            const waterUniforms = {
                uTime: { value: 0 },
                uColor: { value: new THREE.Color(0x2980b9) }
            };

            const waterMat = new THREE.ShaderMaterial({
                vertexShader: waterVertexShader,
                fragmentShader: waterFragmentShader,
                uniforms: waterUniforms,
                transparent: true,
                side: THREE.DoubleSide
            });

            waterMesh = new THREE.Mesh(waterGeo, waterMat);
            waterMesh.position.y = -2.0; // Slightly below terrain
            scene.add(waterMesh);

            // --- Clouds (Simple procedural spheres) ---
            cloudsGroup = new THREE.Group();
            const cloudGeo = new THREE.SphereGeometry(1, 32, 32);
            const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
            
            for(let i=0; i<30; i++) {
                const cloud = new THREE.Mesh(cloudGeo, cloudMat);
                cloud.position.set(
                    (Math.random() - 0.5) * 150,
                    20 + Math.random() * 20,
                    (Math.random() - 0.5) * 100
                );
                const scale = 2 + Math.random() * 5;
                cloud.scale.set(scale, scale * 0.6, scale);
                cloudsGroup.add(cloud);
            }
            scene.add(cloudsGroup);

            // --- Particles (Rain/Snow) ---
            const particleCount = 2000;
            const particleGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            const speeds = new Float32Array(particleCount);

            for(let i=0; i<particleCount; i++) {
                positions[i*3] = (Math.random() - 0.5) * 100;
                positions[i*3+1] = Math.random() * 40;
                positions[i*3+2] = (Math.random() - 0.5) * 100;
                sizes[i] = Math.random() * 2;
                speeds[i] = 0.5 + Math.random();
            }

            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            particleGeo.setAttribute('speed', new THREE.BufferAttribute(speeds, 1));

            const particleMat = new THREE.ShaderMaterial({
                vertexShader: particleVertexShader,
                fragmentShader: particleFragmentShader,
                uniforms: {
                    uTime: { value: 0 },
                    uSpeed: { value: CONFIG.speed }
                },
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            particleSystem = new THREE.Points(particleGeo, particleMat);
            particleSystem.visible = false;
            scene.add(particleSystem);

            // --- Lights ---
            // Ambient light for base visibility
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            // Directional light (Sun)
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(50, 50, -50);
            scene.add(dirLight);

            // --- Event Listeners ---
            window.addEventListener('resize', onWindowResize);
            
            // Start Animation
            animate();
        }

        function onWindowResize() {
            // Keep internal resolution 800x800
            camera.aspect = CONFIG.width / CONFIG.height;
            camera.updateProjectionMatrix();
            renderer.setSize(CONFIG.width, CONFIG.height);
        }

        function updateBiomeLogic(time) {
            // Cyclic biomes based on time
            const index = Math.floor((time * 0.1) % BIOMES.length);
            const nextIndex = (index + 1) % BIOMES.length;
            
            // Smooth transition of text
            const textEl = document.getElementById('location-text');
            
            // Only update text every few seconds to make it readable
            if (Math.floor(time * 10) % 5 === 0 && currentBiome !== BIOMES[index]) {
                textEl.classList.remove('visible');
                setTimeout(() => {
                    textEl.innerText = BIOMES[index];
                    textEl.classList.add('visible');
                }, 500);
            }
            currentBiome = BIOMES[index];

            // Adjust colors based on "time of day" (simulated by sine wave)
            const dayCycle = (Math.sin(time * 0.2) + 1) * 0.5; // 0 to 1
            
            // Sky Color
            const skyColor = new THREE.Color().setHSL(0.6, 0.5, 0.5 + dayCycle * 0.3);
            scene.background = skyColor;
            scene.fog.color = skyColor;

            // Sun Position (Arc)
            const sunX = Math.cos(dayCycle * Math.PI * 2) * 100;
            const sunY = Math.sin(dayCycle * Math.PI * 2) * 100 + 20;
            uniforms.uSunPosition.value.set(sunX, sunY, -50);
            
            // Update sun light intensity
            const sunIntensity = Math.max(0, Math.sin(dayCycle * Math.PI));
            uniforms.uDayTime.value = dayCycle;
        }

        function toggleWeather(time) {
            // Random weather switch
            if (Math.floor(time * 2) % 10 === 0) {
                const isRaining = Math.random() > 0.7;
                particleSystem.visible = isRaining;
                
                if (isRaining) {
                    particleSystem.material.uniforms.uColor.value.setHex(0xaaccff);
                    scene.fog.density = 0.015; // Thicker fog
                } else {
                    scene.fog.density = CONFIG.fogDensity;
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();
            const delta = clock.getDelta();

            // Update Uniforms
            uniforms.uTime.value = time;
            waterMesh.material.uniforms.uTime.value = time;
            particleSystem.material.uniforms.uTime.value = time;

            // Camera Movement (Cinematic Sway)
            // Instead of moving the camera forward endlessly, we move the world backward
            // But here we simulate forward movement by moving the camera forward and resetting
            // Actually, simpler: Camera stays relatively static in Z, but moves in X/Y slightly.
            // The terrain shader handles the "forward" movement via uTime.
            
            // Let's add a subtle "flyover" feel
            const swayX = Math.sin(time * 0.5) * 2;
            const swayY = Math.cos(time * 0.3) * 1;
            
            camera.position.x = THREE.MathUtils.lerp(camera.position.x, swayX, 0.05);
            camera.position.y = THREE.MathUtils.lerp(camera.position.y, 5 + swayY, 0.05);
            camera.lookAt(0, 0, -20); // Look slightly ahead

            // Clouds Movement
            cloudsGroup.children.forEach(cloud => {
                cloud.position.z += CONFIG.speed * 0.5;
                if(cloud.position.z > 50) cloud.position.z = -150;
            });

            // Logic
            updateBiomeLogic(time);
            toggleWeather(time);

            renderer.render(scene, camera);
        }

        // Boot
        init();

    </script>
</body>
</html>
