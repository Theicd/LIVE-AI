<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Simulation</title>
    <style>
        /* This CSS is the secret to making particles look like liquid! */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d1117; /* Dark background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            cursor: crosshair;
        }

        canvas {
            /* The blur merges the particles, and the contrast sharpens the edges */
            filter: blur(10px) contrast(20);
            background-color: transparent;
        }
    </style>
</head>
<body>

<canvas id="fluidCanvas"></canvas>

<script>
    const canvas = document.getElementById('fluidCanvas');
    const ctx = canvas.getContext('2d');

    // Set canvas to window size
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Simulation parameters
    const PARTICLE_COUNT = 200;
    const GRAVITY = 0.15;
    const FRICTION = 0.99;
    const REPULSION_RADIUS = 30;
    const REPULSION_STRENGTH = 0.5;
    const MOUSE_FORCE = 5;

    let particles = [];
    let mouse = { x: -1000, y: -1000, prevX: -1000, prevY: -1000 };

    // Particle Class
    class Particle {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.vx = 0;
            this.vy = 0;
            this.radius = 12; // Drawn radius
        }

        update() {
            // Apply gravity
            this.vy += GRAVITY;

            // Apply friction
            this.vx *= FRICTION;
            this.vy *= FRICTION;

            // Move particle
            this.x += this.vx;
            this.y += this.vy;

            // Boundary collisions (walls)
            if (this.x < this.radius) {
                this.x = this.radius;
                this.vx *= -0.5; // Bounce with energy loss
            }
            if (this.x > canvas.width - this.radius) {
                this.x = canvas.width - this.radius;
                this.vx *= -0.5;
            }
            if (this.y < this.radius) {
                this.y = this.radius;
                this.vy *= -0.5;
            }
            if (this.y > canvas.height - this.radius) {
                this.y = canvas.height - this.radius;
                this.vy *= -0.5;
            }
        }

        draw() {
            // Draw a solid blue circle
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#00aaff"; // Bright blue
            ctx.fill();
            ctx.closePath();
        }
    }

    // Initialize particles at the top of the screen
    function init() {
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new Particle(
                Math.random() * canvas.width,
                Math.random() * canvas.height / 2
            ));
        }
    }

    // Physics loop
    function applyInteractions() {
        for (let i = 0; i < particles.length; i++) {
            let p1 = particles[i];

            // Particle vs Particle (Pressure/Repulsion)
            for (let j = i + 1; j < particles.length; j++) {
                let p2 = particles[j];
                let dx = p2.x - p1.x;
                let dy = p2.y - p1.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < REPULSION_RADIUS && distance > 0) {
                    // Calculate repulsion force
                    let force = (REPULSION_RADIUS - distance) / REPULSION_RADIUS;
                    let directionX = (dx / distance) * force * REPULSION_STRENGTH;
                    let directionY = (dy / distance) * force * REPULSION_STRENGTH;

                    p1.vx -= directionX;
                    p1.vy -= directionY;
                    p2.vx += directionX;
                    p2.vy += directionY;
                }
            }

            // Mouse Interaction
            let mdx = p1.x - mouse.x;
            let mdy = p1.y - mouse.y;
            let mDistance = Math.sqrt(mdx * mdx + mdy * mdy);
            
            if (mDistance < 100) {
                // Push particles away from mouse based on mouse velocity
                let mouseVx = mouse.x - mouse.prevX;
                let mouseVy = mouse.y - mouse.prevY;
                
                p1.vx += mouseVx * 0.1;
                p1.vy += mouseVy * 0.1;
            }
        }
    }

    // Animation Loop
    function animate() {
        // Clear canvas with a slight trail effect (optional)
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        applyInteractions();

        for (let p of particles) {
            p.update();
            p.draw();
        }

        // Update previous mouse position for velocity calculation
        mouse.prevX = mouse.x;
        mouse.prevY = mouse.y;

        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });

    window.addEventListener('touchmove', (e) => {
        e.preventDefault();
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
    }, { passive: false });

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        init();
    });

    // Start simulation
    init();
    animate();

</script>
</body>
</html>
