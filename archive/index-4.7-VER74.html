<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Defender - Retro Arcade</title>
    <style>
        /* --- IMPORT RETRO FONT --- */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --neon-green: #39ff14;
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
            --bg-color: #050505;
            --ui-font: 'Press Start 2P', cursive;
        }

        * {
            box-sizing: border-box;
            touch-action: none; /* Prevent browser zooming/scrolling on mobile */
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: white;
            font-family: var(--ui-font);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- GAME CONTAINER --- */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 600px; /* Arcade cabinet aspect ratioish */
            height: 100%;
            max-height: 800px;
            background: var(--bg-color);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated; /* Essential for retro look */
        }

        /* --- CRT SCANLINE EFFECT --- */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, 0) 50%,
                rgba(0, 0, 0, 0.2) 50%,
                rgba(0, 0, 0, 0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .scanlines::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: rgba(18, 16, 16, 0.1);
            opacity: 0;
            z-index: 2;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.02; }
            50% { opacity: 0.05; }
            100% { opacity: 0.02; }
        }

        /* --- UI OVERLAYS --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            transition: opacity 0.3s;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 2rem;
            color: var(--neon-pink);
            text-shadow: 2px 2px var(--neon-blue);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        p {
            font-size: 0.8rem;
            color: #ddd;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            background: transparent;
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            padding: 15px 30px;
            font-family: var(--ui-font);
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px var(--neon-green);
            transition: all 0.2s;
            margin: 10px;
        }

        .btn:hover {
            background: var(--neon-green);
            color: black;
            box-shadow: 0 0 20px var(--neon-green);
        }

        /* --- HUD --- */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            z-index: 15;
            pointer-events: none;
            text-shadow: 1px 1px 0 #000;
        }

        .hud-item span {
            color: var(--neon-blue);
        }

        /* --- MOBILE CONTROLS --- */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 120px;
            display: none; /* Shown via JS on touch devices */
            z-index: 30;
            pointer-events: none; /* Let clicks pass through gaps */
        }

        .control-btn {
            position: absolute;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(2px);
        }

        .control-btn:active {
            background: rgba(57, 255, 20, 0.3);
            border-color: var(--neon-green);
            color: white;
        }

        #btn-left { bottom: 10px; left: 20px; }
        #btn-right { bottom: 10px; left: 110px; }
        #btn-fire { bottom: 10px; right: 20px; border-color: var(--neon-pink); color: rgba(255, 0, 255, 0.5); }
        #btn-fire:active { background: rgba(255, 0, 255, 0.3); border-color: var(--neon-pink); color: white; }

        /* Helper for auto-demo text */
        #auto-demo-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--neon-pink);
            font-size: 0.8rem;
            z-index: 25;
            pointer-events: none;
            text-shadow: 0 0 5px black;
            display: none;
        }

    </style>
</head>
<body>

<div id="game-container">
    <!-- Canvas for rendering game -->
    <canvas id="gameCanvas"></canvas>

    <!-- CRT Effect Overlay -->
    <div class="scanlines"></div>

    <!-- Heads Up Display -->
    <div id="hud" class="hidden">
        <div class="hud-item">SCORE: <span id="scoreVal">0</span></div>
        <div class="hud-item">HI-SCORE: <span id="highScoreVal">0</span></div>
        <div class="hud-item">LIVES: <span id="livesVal">3</span></div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="ui-layer">
        <h1>NEON DEFENDER</h1>
        <p>Use ARROW KEYS or TOUCH to move.<br>SPACE or AUTO-DEMO to shoot.</p>
        <button class="btn" id="startBtn">INSERT COIN</button>
    </div>

    <!-- Auto Demo Prompt -->
    <div id="demo-overlay" class="ui-layer hidden">
        <h1 style="color: var(--neon-blue);">AUTO-DEMO</h1>
        <p>Watch the system pilot...</p>
        <p style="font-size: 0.6rem;">(Tap to take control)</p>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="ui-layer hidden">
        <h1 style="color: red;">GAME OVER</h1>
        <p>Final Score: <span id="finalScore" style="color: white;">0</span></p>
        <button class="btn" id="restartBtn">TRY AGAIN</button>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls">
        <div id="btn-left" class="control-btn">←</div>
        <div id="btn-right" class="control-btn">→</div>
        <div id="btn-fire" class="control-btn">●</div>
    </div>
    
    <div id="auto-demo-msg">SYSTEM: AUTO PILOT ACTIVE</div>
</div>

<script>
    /**
     * GAME CONFIGURATION & STATE
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Game State Enum
    const STATE = { START: 0, PLAYING: 1, GAMEOVER: 2, AUTO_DEMO: 3 };
    let currentState = STATE.START;
    
    // Variables
    let score = 0;
    let highScore = localStorage.getItem('neonDefenderHighScore') || 0;
    let lives = 3;
    let frames = 0;
    let lastTime = 0;
    let isAutoDemo = false;
    
    // Entities
    let player;
    let bullets = [];
    let enemies = [];
    let particles = [];
    let stars = [];

    // Input State
    const keys = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false, Space: false };
    
    // Audio Context (Lazy load)
    let audioCtx;
    
    /**
     * AUDIO SYSTEM (Web Audio API - Chiptune Synth)
     */
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'shoot') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.exponentialRampToValueAtTime(110, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'explosion') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.3);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'hit') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.1);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'gameover') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.linearRampToValueAtTime(50, now + 1.0);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 1.0);
            osc.start(now);
            osc.stop(now + 1.0);
        }
    }

    /**
     * GAME CLASSES
     */
    class Player {
        constructor() {
            this.width = 30;
            this.height = 30;
            this.x = canvas.width / 2 - this.width / 2;
            this.y = canvas.height - this.height - 20;
            this.speed = 5;
            this.color = '#00ffff';
            this.lastShot = 0;
            this.shootDelay = 15; // Frames
        }

        update() {
            // Auto Demo Logic
            if (isAutoDemo) {
                // Simple AI: Move back and forth, shoot periodically
                if (frames % 60 === 0) {
                    this.x = Math.random() * (canvas.width - this.width);
                }
                if (frames % 20 === 0) {
                    bullets.push(new Bullet(this.x + this.width / 2, this.y));
                }
            } else {
                // Player Logic
                if (keys.ArrowLeft) this.x -= this.speed;
                if (keys.ArrowRight) this.x += this.speed;
                if (keys.ArrowUp) this.y -= this.speed;
                if (keys.ArrowDown) this.y += this.speed;

                if (keys.Space && frames - this.lastShot > this.shootDelay) {
                    bullets.push(new Bullet(this.x + this.width / 2, this.y));
                    playSound('shoot');
                    this.lastShot = frames;
                }
            }

            // Boundaries
            if (this.x < 0) this.x = 0;
            if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;
            if (this.y < 0) this.y = 0;
            if (this.y + this.height > canvas.height) this.y = canvas.height - this.height;
        }

        draw() {
            ctx.fillStyle = this.color;
            // Draw a simple ship shape
            ctx.beginPath();
            ctx.moveTo(this.x + this.width / 2, this.y);
            ctx.lineTo(this.x + this.width, this.y + this.height);
            ctx.lineTo(this.x + this.width / 2, this.y + this.height - 10);
            ctx.lineTo(this.x, this.y + this.height);
            ctx.closePath();
            ctx.fill();

            // Engine glow
            ctx.fillStyle = '#ff00ff';
            ctx.fillRect(this.x + this.width/2 - 2, this.y + this.height - 5, 4, 5);
        }
    }

    class Bullet {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.radius = 3;
            this.speed = 8;
            this.color = '#ff00ff';
            this.markedForDeletion = false;
        }

        update() {
            this.y -= this.speed;
            if (this.y < 0) this.markedForDeletion = true;
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();
            // Trail
            ctx.fillStyle = 'rgba(255, 0, 255, 0.3)';
            ctx.fillRect(this.x - 1, this.y + 2, 2, 10);
        }
    }

    class Enemy {
        constructor() {
            this.width = 30;
            this.height = 30;
            this.x = Math.random() * (canvas.width - this.width);
            this.y = -this.height;
            this.speed = Math.random() * 2 + 1 + (score / 500); // Gets faster
            this.color = '#39ff14';
            this.markedForDeletion = false;
            // Wobble effect
            this.angle = 0;
            this.angleSpeed = Math.random() * 0.1 - 0.05;
        }

        update() {
            this.y += this.speed;
            this.x += Math.sin(this.angle) * 2;
            this.angle += this.angleSpeed;

            if (this.y > canvas.height) {
                this.markedForDeletion = true;
                // Penalty for missing? Optional.
            }
        }

        draw() {
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 2;
            ctx.strokeRect(this.x, this.y, this.width, this.height);
            
            // Inner core
            ctx.fillStyle = 'rgba(57, 255, 20, 0.2)';
            ctx.fillRect(this.x, this.y, this.width, this.height);
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = Math.random() * 3 + 1;
            this.speedX = Math.random() * 6 - 3;
            this.speedY = Math.random() * 6 - 3;
            this.color = color;
            this.life = 1.0;
            this.decay = Math.random() * 0.03 + 0.02;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.life -= this.decay;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    class Star {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 1.5;
            this.speed = Math.random() * 3 + 0.5;
        }
        update() {
            this.y += this.speed;
            if (this.y > canvas.height) {
                this.y = 0;
                this.x = Math.random() * canvas.width;
            }
        }
        draw() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.fillRect(this.x, this.y, this.size, this.size);
        }
    }

    /**
     * GAME LOGIC
     */
    function resize() {
        canvas.width = document.getElementById('game-container').offsetWidth;
        canvas.height = document.getElementById('game-container').offsetHeight;
    }

    function createExplosion(x, y, color) {
        for (let i = 0; i < 8; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function checkCollisions() {
        // Bullet vs Enemy
        bullets.forEach(bullet => {
            enemies.forEach(enemy => {
                if (!bullet.markedForDeletion && !enemy.markedForDeletion) {
                    if (
                        bullet.x > enemy.x &&
                        bullet.x < enemy.x + enemy.width &&
                        bullet.y > enemy.y &&
                        bullet.y < enemy.y + enemy.height
                    ) {
                        bullet.markedForDeletion = true;
                        enemy.markedForDeletion = true;
                        createExplosion(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.color);
                        score += 10;
                        playSound('hit');
                        updateUI();
                    }
                }
            });
        });

        // Player vs Enemy
        enemies.forEach(enemy => {
            if (!enemy.markedForDeletion) {
                // Simple box collision
                if (
                    player.x < enemy.x + enemy.width &&
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y
                ) {
                    enemy.markedForDeletion = true;
                    createExplosion(enemy.x + enemy.width/2, enemy.y + enemy.height/2, '#ff0000');
                    lives--;
                    playSound('explosion');
                    updateUI();
                    
                    // Screen shake effect (simple offset)
                    canvas.style.transform = `translate(${Math.random()*10-5}px, ${Math.random()*10-5}px)`;
                    setTimeout(() => canvas.style.transform = 'none', 50);

                    if (lives <= 0) {
                        endGame();
                    }
                }
            }
        });
    }

    function updateUI() {
        document.getElementById('scoreVal').innerText = score;
        document.getElementById('livesVal').innerText = lives;
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('neonDefenderHighScore', highScore);
        }
        document.getElementById('highScoreVal').innerText = highScore;
    }

    function startGame() {
        initAudio();
        resize();
        score = 0;
        lives = 3;
        bullets = [];
        enemies = [];
        particles = [];
        stars = [];
        player = new Player();
        
        // Create background stars
        for(let i=0; i<50; i++) stars.push(new Star());

        currentState = STATE.PLAYING;
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('gameover-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        
        updateUI();
        animate(0);
    }

    function endGame() {
        currentState = STATE.GAMEOVER;
        playSound('gameover');
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('gameover-screen').classList.remove('hidden');
        document.getElementById('finalScore').innerText = score;
    }

    function triggerAutoDemo() {
        if (currentState !== STATE.PLAYING) return;
        isAutoDemo = true;
        currentState = STATE.AUTO_DEMO;
        document.getElementById('auto-demo-msg').style.display = 'block';
        
        // Auto demo lasts 10 seconds
        setTimeout(() => {
            if (currentState === STATE.AUTO_DEMO) {
                document.getElementById('demo-overlay').classList.remove('hidden');
            }
        }, 10000);
    }

    /**
     * MAIN LOOP
     */
    function animate(timeStamp) {
        if (currentState === STATE.GAMEOVER) return;

        const deltaTime = timeStamp - lastTime;
        lastTime = timeStamp;
        frames++;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Stars
        stars.forEach(star => {
            star.update();
            star.draw();
        });

        if (currentState === STATE.PLAYING || currentState === STATE.AUTO_DEMO) {
            // Spawn Enemies
            if (frames % 60 === 0) {
                enemies.push(new Enemy());
            }

            // Update Entities
            player.update();
            player.draw();

            bullets.forEach((bullet, index) => {
                bullet.update();
                bullet.draw();
                if (bullet.markedForDeletion) bullets.splice(index, 1);
            });

            enemies.forEach((enemy, index) => {
                enemy.update();
                enemy.draw();
                if (enemy.markedForDeletion) enemies.splice(index, 1);
            });

            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(index, 1);
            });

            checkCollisions();
        }

        requestAnimationFrame(animate);
    }

    /**
     * EVENT LISTENERS
     */
    window.addEventListener('resize', resize);
    
    // Keyboard
    window.addEventListener('keydown', e => {
        if (e.code === 'ArrowLeft') keys.ArrowLeft = true;
        if (e.code === 'ArrowRight') keys.ArrowRight = true;
        if (e.code === 'ArrowUp') keys.ArrowUp = true;
        if (e.code === 'ArrowDown') keys.ArrowDown = true;
        if (e.code === 'Space') keys.Space = true;
        
        // Toggle Auto Demo if playing
        if (e.code === 'Space' && currentState === STATE.AUTO_DEMO) {
            isAutoDemo = false;
            document.getElementById('demo-overlay').classList.add('hidden');
            document.getElementById('auto-demo-msg').style.display = 'none';
            playSound('hit'); // Feedback
        }
    });

    window.addEventListener('keyup', e => {
        if (e.code === 'ArrowLeft') keys.ArrowLeft = false;
        if (e.code === 'ArrowRight') keys.ArrowRight = false;
        if (e.code === 'ArrowUp') keys.ArrowUp = false;
        if (e.code === 'ArrowDown') keys.ArrowDown = false;
        if (e.code === 'Space') keys.Space = false;
    });

    // Touch Controls
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const btnFire = document.getElementById('btn-fire');

    const addTouch = (elem, code) => {
        elem.addEventListener('touchstart', (e) => { e.preventDefault(); keys[code] = true; });
        elem.addEventListener('touchend', (e) => { e.preventDefault(); keys[code] = false; });
        elem.addEventListener('mousedown', (e) => { e.preventDefault(); keys[code] = true; });
        elem.addEventListener('mouseup', (e) => { e.preventDefault(); keys[code] = false; });
    };

    addTouch(btnLeft, 'ArrowLeft');
    addTouch(btnRight, 'ArrowRight');
    addTouch(btnFire, 'Space');

    // UI Buttons
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);
    
    // Auto Demo Prompt
    document.getElementById('demo-overlay').addEventListener('click', () => {
        isAutoDemo = false;
        document.getElementById('demo-overlay').classList.add('hidden');
        document.getElementById('auto-demo-msg').style.display = 'none';
        playSound('hit');
    });

    // Initialize High Score Display
    document.getElementById('highScoreVal').innerText = highScore;

    // Check for touch device
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        document.getElementById('mobile-controls').style.display = 'block';
    }

    // Initial setup
    resize();
    
    // Start Auto-Demo immediately if user doesn't interact
    // But we wait for a brief moment to let the user see the Start Screen
    setTimeout(triggerAutoDemo, 2000);

</script>
</body>
</html>
