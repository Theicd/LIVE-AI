<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future OS: Command Center</title>
    <style>
        :root {
            --bg-color: #050a10;
            --panel-bg: rgba(10, 20, 30, 0.85);
            --primary: #00f3ff;
            --secondary: #ff0055;
            --warning: #ffcc00;
            --success: #00ff66;
            --text-main: #e0f0ff;
            --text-dim: #8899aa;
            --grid-line: rgba(0, 243, 255, 0.1);
            --font-mono: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; user-select: none; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-mono);
            overflow: hidden;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* --- INTRO OVERLAY --- */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease-out;
        }
        
        .loader-text {
            font-size: 2rem;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
            margin-bottom: 20px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .loader-bar {
            width: 300px; height: 4px; background: #111;
            position: relative; overflow: hidden;
            border: 1px solid #333;
        }

        .loader-fill {
            position: absolute; top: 0; left: 0; height: 100%;
            width: 0%; background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            transition: width 1s linear;
        }

        /* --- DESKTOP --- */
        #desktop {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 1s;
        }

        #desktop.active { opacity: 1; }

        /* --- TOP BAR --- */
        header {
            height: 40px;
            background: rgba(0,0,0,0.8);
            border-bottom: 1px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 0.8rem;
            z-index: 100;
        }

        .sys-time { color: var(--text-dim); }
        .sys-time span { color: var(--primary); font-weight: bold; }

        /* --- TASKBAR --- */
        #taskbar {
            height: 50px;
            background: rgba(5, 10, 16, 0.9);
            border-top: 1px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 90;
        }

        .task-icon {
            width: 40px; height: 40px;
            border: 1px solid var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255,255,255,0.05);
        }

        .task-icon:hover { border-color: var(--primary); box-shadow: 0 0 8px var(--primary); }
        .task-icon svg { width: 20px; height: 20px; fill: var(--text-dim); }
        .task-icon.active svg { fill: var(--primary); }

        /* --- WINDOWS --- */
        .window {
            position: absolute;
            background: var(--panel-bg);
            border: 1px solid var(--primary);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            top: 50px; left: 50px;
            width: 400px; height: 300px;
            min-width: 300px; min-height: 200px;
            z-index: 50;
            transform: scale(0.95);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .window.open { opacity: 1; pointer-events: all; transform: scale(1); }

        .win-header {
            background: rgba(0, 243, 255, 0.1);
            padding: 8px 12px;
            font-size: 0.8rem;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            cursor: move;
            display: flex; justify-content: space-between;
        }

        .win-body {
            flex: 1; padding: 15px; overflow-y: auto; position: relative;
        }

        .close-btn {
            cursor: pointer; color: var(--secondary); font-weight: bold;
        }

        /* --- TERMINAL --- */
        #terminal-output {
            font-size: 0.9rem; line-height: 1.4;
            color: var(--success); margin-bottom: 10px;
        }
        .cursor {
            display: inline-block; width: 8px; height: 14px;
            background: var(--success); animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* --- AI CHAT --- */
        .chat-container {
            display: flex; flex-direction: column; height: 100%;
            gap: 10px;
        }
        .chat-bubble {
            background: rgba(0, 255, 102, 0.1);
            border-left: 2px solid var(--success);
            padding: 10px;
            font-size: 0.9rem;
        }
        .waveform {
            display: flex; align-items: flex-end; gap: 2px; height: 20px; margin-top: 10px;
        }
        .bar {
            width: 4px; background: var(--success);
            animation: wave 1s ease-in-out infinite;
        }
        .bar:nth-child(1) { height: 50%; animation-delay: 0s; }
        .bar:nth-child(2) { height: 100%; animation-delay: 0.1s; }
        .bar:nth-child(3) { height: 80%; animation-delay: 0.2s; }
        .bar:nth-child(4) { height: 60%; animation-delay: 0.3s; }
        @keyframes wave {
            0%, 100% { height: 20%; opacity: 0.5; }
            50% { height: 100%; opacity: 1; box-shadow: 0 0 10px var(--success); }
        }

        /* --- MAP --- */
        #map-canvas {
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,20,0,1) 0%, rgba(0,0,0,1) 100%);
        }
        .map-overlay {
            position: absolute; top: 10px; left: 10px;
            color: var(--warning); font-size: 0.7rem;
            border: 1px solid var(--warning);
            padding: 5px;
            pointer-events: none;
        }

        /* --- MISSION BOARDS --- */
        .status-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            font-size: 0.75rem;
        }
        .status-item { display: flex; justify-content: space-between; border-bottom: 1px dashed #333; padding: 5px 0; }
        .progress-bar { 
            width: 100%; height: 6px; background: #222; margin-top: 5px;
            position: relative;
        }
        .progress-fill { height: 100%; background: var(--warning); width: 0%; transition: width 1s; }

        /* --- HOLOGRAM --- */
        .holo-container {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            perspective: 600px;
        }
        .holo-globe {
            width: 150px; height: 150px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 20px var(--primary), inset 0 0 20px var(--primary);
            animation: rotateHolo 4s linear infinite;
            transform-style: preserve-3d;
        }
        .holo-ring {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid var(--secondary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--secondary);
        }
        .ring-1 { width: 180px; height: 180px; animation: spinR 3s linear infinite reverse; }
        .ring-2 { width: 120px; height: 120px; animation: spinR 2s linear infinite; }
        
        .holo-data {
            position: absolute; bottom: 20px; width: 100%;
            text-align: center; font-size: 0.7rem; color: var(--primary);
            animation: pulseText 2s infinite;
        }

        @keyframes rotateHolo { 0% { transform: rotateY(0deg) rotateX(10deg); } 100% { transform: rotateY(360deg) rotateX(10deg); } }
        @keyframes spinR { 0% { transform: translate(-50%, -50%) rotateZ(0deg) rotateX(75deg); } 100% { transform: translate(-50%, -50%) rotateZ(360deg) rotateX(75deg); } }
        @keyframes pulseText { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; text-shadow: 0 0 10px var(--primary); } }

        /* Responsive */
        @media (max-width: 600px) {
            .window { width: 90%; left: 5%; top: 80px; height: auto; }
            #taskbar { gap: 10px; }
            .task-icon { width: 35px; height: 35px; }
        }

        /* Utility Classes for Demo */
        .threat-ping {
            position: absolute; width: 20px; height: 20px;
            border: 2px solid var(--secondary); border-radius: 50%;
            animation: pingAnim 2s infinite;
        }
        @keyframes pingAnim {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

    </style>
</head>
<body>

    <!-- INTRO OVERLAY -->
    <div id="intro-overlay">
        <div class="loader-text">System Initializing...</div>
        <div class="loader-bar">
            <div class="loader-fill" id="intro-progress"></div>
        </div>
    </div>

    <!-- MAIN DESKTOP -->
    <div id="desktop">
        <header>
            <div class="sys-status">CONN: SECURE</div>
            <div class="sys-time">DATE: <span id="clock">--</span></div>
            <div class="sys-temp">TEMP: 340K</div>
        </header>

        <!-- TERMINAL WINDOW -->
        <div id="win-terminal" class="window">
            <div class="win-header">
                <span>TERMINAL_V2.4</span>
                <span class="close-btn" onclick="winManager.close('win-terminal')">X</span>
            </div>
            <div class="win-body">
                <div id="terminal-output"></div>
                <span id="terminal-input-line">></span><span class="cursor"></span>
            </div>
        </div>

        <!-- AI CHAT WINDOW -->
        <div id="win-ai" class="window">
            <div class="win-header">
                <span>AI_CORE_ANALYST</span>
                <span class="close-btn" onclick="winManager.close('win-ai')">X</span>
            </div>
            <div class="win-body">
                <div class="chat-container" id="chat-container">
                    <div class="chat-bubble">Analyzing sector...</div>
                </div>
                <div class="waveform" id="waveform" style="opacity: 0;">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                </div>
            </div>
        </div>

        <!-- MAP WINDOW -->
        <div id="win-map" class="window">
            <div class="win-header">
                <span>GEO_SPATIAL_MAP</span>
                <span class="close-btn" onclick="winManager.close('win-map')">X</span>
            </div>
            <div class="win-body" style="padding: 0; overflow: hidden;">
                <canvas id="map-canvas"></canvas>
                <div class="map-overlay">THREAT LEVEL: HIGH</div>
                <div id="map-target" class="threat-ping" style="top: 30%; left: 40%;"></div>
            </div>
        </div>

        <!-- MISSION BOARD WINDOW -->
        <div id="win-mission" class="window">
            <div class="win-header">
                <span>MISSION_STATUS</span>
                <span class="close-btn" onclick="winManager.close('win-mission')">X</span>
            </div>
            <div class="win-body">
                <div class="status-grid">
                    <div class="status-item"><span>Mission Alpha</span><span>100%</span></div>
                    <div class="progress-bar"><div class="progress-fill" id="prog-1"></div></div>
                    
                    <div class="status-item"><span>Defense Grid</span><span>85%</span></div>
                    <div class="progress-bar"><div class="progress-fill" id="prog-2"></div></div>
                    
                    <div class="status-item"><span>Sat Uplink</span><span>ERR</span></div>
                    <div class="progress-bar"><div class="progress-fill" id="prog-3"></div></div>
                </div>
                <div style="margin-top: 20px; color: var(--secondary); font-size: 0.8rem;">
                    WARNING: UNIDENTIFIED SIGNAL DETECTED
                </div>
            </div>
        </div>

        <!-- HOLOGRAPHY WINDOW -->
        <div id="win-holo" class="window">
            <div class="win-header">
                <span>3D_HOLO_VIEW</span>
                <span class="close-btn" onclick="winManager.close('win-holo')">X</span>
            </div>
            <div class="win-body" style="background: radial-gradient(circle, #000, #050a10);">
                <div class="holo-container">
                    <div class="holo-globe">
                        <div class="holo-ring ring-1"></div>
                        <div class="holo-ring ring-2"></div>
                    </div>
                    <div class="holo-data">
                        LAYER: SECTOR 7<br>
                        ROTATION: ACTIVE
                    </div>
                </div>
            </div>
        </div>

        <!-- TASKBAR -->
        <div id="taskbar">
            <div class="task-icon" onclick="winManager.toggle('win-terminal')">
                <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12z"/></svg>
            </div>
            <div class="task-icon" onclick="winManager.toggle('win-map')">
                <svg viewBox="0 0 24 24"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>
            </div>
            <div class="task-icon" onclick="winManager.toggle('win-mission')">
                <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            </div>
            <div class="task-icon" onclick="winManager.toggle('win-holo')">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
            </div>
        </div>
    </div>

    <script>
        /* --- SYSTEM CLOCK --- */
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        /* --- WINDOW MANAGER --- */
        const winManager = {
            zIndex: 100,
            bringToFront: (id) => {
                const el = document.getElementById(id);
                if(el) {
                    winManager.zIndex++;
                    el.style.zIndex = winManager.zIndex;
                }
            },
            toggle: (id) => {
                const el = document.getElementById(id);
                if(el.classList.contains('open')) {
                    el.classList.remove('open');
                    document.querySelector(`.task-icon[onclick*="${id}"]`).classList.remove('active');
                } else {
                    winManager.bringToFront(id);
                    el.classList.add('open');
                    document.querySelector(`.task-icon[onclick*="${id}"]`).classList.add('active');
                    
                    // Adjust specific layouts
                    if(id === 'win-map') drawMap();
                }
            },
            close: (id) => {
                document.getElementById(id).classList.remove('open');
                document.querySelector(`.task-icon[onclick*="${id}"]`).classList.remove('active');
            }
        };

        // Basic Draggable logic for windows
        document.querySelectorAll('.window').forEach(win => {
            const header = win.querySelector('.win-header');
            header.addEventListener('mousedown', () => winManager.bringToFront(win.id));
            header.addEventListener('click', (e) => e.stopPropagation()); // Prevent drag triggering click

            let isDragging = false;
            let offsetX, offsetY;

            header.addEventListener('mousedown', (e) => {
                isDragging = true;
                offsetX = e.clientX - win.offsetLeft;
                offsetY = e.clientY - win.offsetTop;
                header.style.cursor = 'grabbing';
            });

            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    win.style.left = (e.clientX - offsetX) + 'px';
                    win.style.top = (e.clientY - offsetY) + 'px';
                }
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
                header.style.cursor = 'move';
            });
        });

        /* --- TERMINAL LOGIC --- */
        const terminal = {
            output: document.getElementById('terminal-output'),
            line: document.getElementById('terminal-input-line'),
            append: (text, color = 'var(--success)') => {
                const span = document.createElement('div');
                span.innerHTML = `<span style="color:${color}">${text}</span>`;
                terminal.output.appendChild(span);
                terminal.output.scrollTop = terminal.output.scrollHeight;
            },
            clear: () => {
                terminal.output.innerHTML = '';
            },
            type: (cmd, callback) => {
                terminal.append(`> ${cmd}`);
                setTimeout(() => {
                    if(callback) callback();
                }, 1000);
            }
        };

        /* --- MAP LOGIC (CANVAS) --- */
        const mapCanvas = document.getElementById('map-canvas');
        const mapCtx = mapCanvas.getContext('2d');
        let mapOffsetX = 0;
        let mapTargetX = 0;

        function resizeMap() {
            mapCanvas.width = mapCanvas.parentElement.offsetWidth;
            mapCanvas.height = mapCanvas.parentElement.offsetHeight;
        }
        window.addEventListener('resize', resizeMap);

        function drawMap() {
            resizeMap();
            mapCtx.fillStyle = '#050a10';
            mapCtx.fillRect(0, 0, mapCanvas.width, mapCanvas.height);

            // Grid lines
            mapCtx.strokeStyle = 'rgba(0, 243, 255, 0.2)';
            mapCtx.lineWidth = 1;
            const gridSize = 40;
            const startX = mapOffsetX % gridSize;

            for (let x = startX; x < mapCanvas.width; x += gridSize) {
                mapCtx.beginPath(); mapCtx.moveTo(x, 0); mapCtx.lineTo(x, mapCanvas.height); mapCtx.stroke();
            }
            for (let y = 0; y < mapCanvas.height; y += gridSize) {
                mapCtx.beginPath(); mapCtx.moveTo(0, y); mapCtx.lineTo(mapCanvas.width, y); mapCtx.stroke();
            }

            // Stylized "Land" blobs (Procedural-ish)
            mapCtx.fillStyle = 'rgba(0, 243, 255, 0.1)';
            const time = Date.now() * 0.001;
            const blob1x = (mapOffsetX * 0.5) + 100;
            const blob2x = (mapOffsetX * 0.5) + 400;
            
            // Draw blobs with movement
            mapCtx.beginPath();
            mapCtx.ellipse(Math.sin(time)*50 + 150 + mapOffsetX, 100, 50, 30, 0, 0, Math.PI * 2);
            mapCtx.fill();

            mapCtx.beginPath();
            mapCtx.ellipse(Math.sin(time*0.8)*40 + 500 + mapOffsetX, 200, 40, 20, 1, 0, Math.PI * 2);
            mapCtx.fill();
        }

        /* --- DEMO SCRIPT CONTROLLER --- */
        const demoScript = [
            // 0s - Initial Load
            () => {
                document.getElementById('intro-progress').style.width = '100%';
                setTimeout(() => {
                    document.getElementById('intro-overlay').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('intro-overlay').style.display = 'none';
                        document.getElementById('desktop').classList.add('active');
                        runSequence();
                    }, 1000);
                }, 5000);
            },
            // 5.5s
            () => {
                winManager.toggle('win-terminal');
                setTimeout(() => terminal.type('system_check'), 500);
            },
            // 8.5s
            () => terminal.type('>> status', 'var(--warning)'),
            // 10.5s
            () => terminal.type('SYSTEM NORMAL', 'var(--success)'),
            // 12.5s
            () => {
                winManager.close('win-terminal');
                winManager.toggle('win-map');
                mapTargetX = -50; // Start pan
            },
            // 17s
            () => {
                // Simulate Ping
                const target = document.getElementById('map-target');
                target.style.top = '50%';
                target.style.left = '70%';
            },
            // 20s
            () => {
                winManager.close('win-map');
                winManager.toggle('win-mission');
            },
            // 22s
            () => {
                document.getElementById('prog-1').style.width = '100%';
                document.getElementById('prog-2').style.width = '85%';
                document.getElementById('prog-3').style.width = '60%';
            },
            // 25s
            () => {
                winManager.toggle('win-ai');
            },
            // 27s
            () => {
                const chat = document.getElementById('chat-container');
                chat.innerHTML = ''; // Clear
                terminal.type('AI_QUERY');
                setTimeout(() => {
                    chat.innerHTML += `<div class="chat-bubble">Detected anomaly in Sector 7. Confidence: 98%.</div>`;
                    const wave = document.getElementById('waveform');
                    wave.style.opacity = '1';
                }, 1000);
            },
            // 29s
            () => {
                const wave = document.getElementById('waveform');
                wave.style.opacity = '0';
                winManager.close('win-ai');
                winManager.toggle('win-holo');
            },
            // 31s
            () => {
                winManager.close('win-holo');
                winManager.toggle('win-terminal');
                terminal.append('DEMO COMPLETE. SYSTEM IDLE.', 'var(--primary)');
            }
        ];

        function runSequence() {
            let time = 0;
            const speed = 2000; // ms between steps

            demoScript.forEach((step, index) => {
                setTimeout(step, (index + 1) * speed);
            });
        }

        // Animation Loop for Map Panning
        function animate() {
            // Panning map logic
            if(mapTargetX !== 0) {
                mapOffsetX += (mapTargetX - mapOffsetX) * 0.05;
                drawMap();
            }
            requestAnimationFrame(animate);
        }
        animate();

        // Start Intro
        demoScript[0]();

    </script>
</body>
</html>
