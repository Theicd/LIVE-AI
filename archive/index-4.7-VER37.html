<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS AI - Futuristic Interface</title>
    <!-- Import Google Fonts for Futuristic Look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #00f3ff; /* Cyan */
            --secondary-color: #bc13fe; /* Neon Purple */
            --bg-dark: #050510;
            --bg-panel: rgba(20, 20, 35, 0.7);
            --text-main: #e0e0e0;
            --text-dim: #8a8a9b;
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --glow: 0 0 10px rgba(0, 243, 255, 0.5);
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-color) var(--bg-dark);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 3px;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(188, 19, 254, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.1) 0%, transparent 20%),
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 260px;
            background: var(--bg-panel);
            backdrop-filter: blur(10px);
            border-right: var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .brand {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: var(--glow);
            letter-spacing: 1px;
        }

        .brand-icon {
            width: 24px;
            height: 24px;
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            position: relative;
        }
        .brand-icon::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: var(--primary-color);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .nav-links {
            list-style: none;
            flex-grow: 1;
        }

        .nav-item {
            margin-bottom: 10px;
        }

        .nav-btn {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 12px 15px;
            text-align: left;
            font-family: var(--font-body);
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-btn:hover, .nav-btn.active {
            background: rgba(0, 243, 255, 0.1);
            color: var(--primary-color);
            border-left: 3px solid var(--primary-color);
        }

        .nav-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .system-status {
            border-top: var(--glass-border);
            padding-top: 20px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #0f0;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #0f0;
        }

        /* --- Main Chat Area --- */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .top-bar {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: var(--glass-border);
            background: rgba(5, 5, 16, 0.5);
        }

        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--primary-color);
            cursor: pointer;
        }

        .model-selector {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: var(--font-body);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .chat-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            gap: 15px;
            max-width: 80%;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.4s forwards ease-out;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.ai {
            align-self: flex-start;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .message.ai .avatar {
            background: rgba(188, 19, 254, 0.1);
            border-color: var(--secondary-color);
        }

        .avatar svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .bubble {
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1rem;
            line-height: 1.5;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .message.user .bubble {
            background: linear-gradient(135deg, var(--primary-color), #0077ff);
            color: #000;
            border-bottom-right-radius: 2px;
            font-weight: 600;
        }

        .message.ai .bubble {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 3px solid var(--secondary-color);
            border-top-left-radius: 2px;
            backdrop-filter: blur(5px);
            color: var(--text-main);
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none; /* Hidden by default */
            gap: 5px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border-left: 3px solid var(--secondary-color);
            width: fit-content;
            margin-bottom: 10px;
            animation: slideUp 0.3s forwards ease-out;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--secondary-color);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        /* --- Input Area --- */
        .input-area {
            padding: 20px;
            background: rgba(5, 5, 16, 0.9);
            border-top: var(--glass-border);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .input-wrapper {
            flex-grow: 1;
            position: relative;
        }

        textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 15px 50px 15px 25px;
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 1rem;
            resize: none;
            height: 50px;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .send-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), #00a8ff);
            border: none;
            color: #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
            margin-left: 2px; /* Visual adjustment */
        }

        /* --- Toast Notification --- */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(188, 19, 254, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-family: var(--font-display);
            font-size: 0.9rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* --- Animations --- */
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.7; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.7; }
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* --- Responsive Design --- */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                height: 100%;
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .mobile-toggle {
                display: block;
            }

            .message {
                max-width: 90%;
            }
            
            .brand {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-icon"></div>
            NEXUS AI
        </div>

        <ul class="nav-links">
            <li class="nav-item">
                <button class="nav-btn active" onclick="setActive(this)">
                    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                    New Chat
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-btn" onclick="setActive(this)">
                    <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
                    History
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-btn" onclick="setActive(this)">
                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                    Settings
                </button>
            </li>
        </ul>

        <div class="system-status">
            <p><span class="status-indicator"></span>System Online</p>
            <p style="margin-top:5px; font-size: 0.75rem; color: #555;">v.4.0.2 Stable</p>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="top-bar">
            <button class="mobile-toggle" id="menuBtn">
                <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="model-selector">
                NEXUS-7 Model
            </div>
            <div style="width: 28px;"></div> <!-- Spacer for balance -->
        </header>

        <div class="chat-container" id="chatContainer">
            <!-- Welcome Message -->
            <div class="message ai">
                <div class="avatar">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                </div>
                <div class="bubble">
                    Greetings. I am NEXUS, your advanced AI interface. I am ready to process data and assist with your tasks. How may I help you today?
                </div>
            </div>
            
            <!-- Typing Indicator (Hidden initially) -->
            <div class="typing-indicator" id="typingIndicator">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <footer class="input-area">
            <div class="input-wrapper">
                <textarea id="userInput" placeholder="Enter command or query..." rows="1"></textarea>
            </div>
            <button class="send-btn" id="sendBtn" aria-label="Send Message">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </footer>
    </main>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <svg style="width:20px; height:20px; fill:white;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        <span id="toastMsg">Message cannot be empty</span>
    </div>

    <script>
        // DOM Elements
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const sidebar = document.getElementById('sidebar');
        const menuBtn = document.getElementById('menuBtn');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        // State
        let isProcessing = false;

        // AI Responses Database (Simulated)
        const aiResponses = [
            "Processing your request. Analyzing semantic structure...",
            "Accessing global database... Data retrieved successfully.",
            "I can certainly help with that. Please elaborate.",
            "Calculating optimal solution based on your parameters.",
            "My neural networks are operating at 100% efficiency.",
            "Interesting query. Here is a breakdown of the analysis.",
            "Command acknowledged. Executing protocols.",
            "I have updated my internal memory with that information."
        ];

        // --- Event Listeners ---

        // Auto-resize textarea
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if(this.value === '') this.style.height = '50px';
        });

        // Send on Enter (Shift+Enter for new line)
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        sendBtn.addEventListener('click', handleSend);

        // Mobile Menu Toggle
        menuBtn.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768 && 
                !sidebar.contains(e.target) && 
                !menuBtn.contains(e.target) &&
                sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
            }
        });

        // --- Core Functions ---

        function setActive(btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // On mobile, close sidebar after selection
            if (window.innerWidth <= 768) {
                sidebar.classList.remove('open');
            }
        }

        function showToast(message) {
            toastMsg.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function createMessageElement(text, isUser) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', isUser ? 'user' : 'ai');
            
            const avatarSvg = isUser 
                ? '<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>'
                : '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>';

            msgDiv.innerHTML = `
                <div class="avatar">${avatarSvg}</div>
                <div class="bubble">${text}</div>
            `;
            
            return msgDiv;
        }

        function typeWriterEffect(element, text) {
            let i = 0;
            const speed = 20; // ms per char
            
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    // Scroll to bottom as we type
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        function handleSend() {
            const text = userInput.value.trim();
            
            if (!text) {
                showToast("Input field is empty.");
                return;
            }

            if (isProcessing) return;

            // 1. Add User Message
            chatContainer.appendChild(createMessageElement(text, true));
            userInput.value = '';
            userInput.style.height = '50px';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 2. Show Typing Indicator
            isProcessing = true;
            chatContainer.appendChild(typingIndicator);
            typingIndicator.style.display = 'flex';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 3. Simulate AI Delay and Response
            const delay = Math.random() * 1500 + 1000; // Random delay 1-2.5s
            
            setTimeout(() => {
                // Remove typing indicator
                typingIndicator.style.display = 'none';
                
                // Pick random response or generic fallback
                const responseText = aiResponses[Math.floor(Math.random() * aiResponses.length)];
                
                // Add AI Message
                const aiMsgDiv = createMessageElement('', false); // Empty initially for typewriter
                chatContainer.appendChild(aiMsgDiv);
                
                // Start typing effect
                typeWriterEffect(aiMsgDiv.querySelector('.bubble'), responseText);
                
                isProcessing = false;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, delay);
        }

        // Initialize focus
        userInput.focus();
    </script>
</body>
</html>
