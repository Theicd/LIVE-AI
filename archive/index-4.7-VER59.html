<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hearth — A Quiet Evening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,500&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ember:#ffcf8a;
    --cream:#f4e4c8;
    --wood-deep:#1a0e07;
    --stone-1:#3a2418;
    --stone-2:#5a4036;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0d0806;font-family:'Outfit',sans-serif;color:var(--cream)}

  .scene{
    position:relative;width:100vw;height:100vh;overflow:hidden;
    background:
      radial-gradient(ellipse 70% 50% at 50% 70%, rgba(255,120,40,.10), transparent 60%),
      radial-gradient(ellipse at center, #1a0f08 0%, #0a0604 100%);
  }

  /* Wall + wood paneling */
  .wall{
    position:absolute;inset:0;
    background:
      repeating-linear-gradient(90deg, transparent 0, transparent 120px, rgba(0,0,0,.25) 120px, rgba(0,0,0,.25) 122px),
      linear-gradient(180deg, #1d1109 0%, #0e0805 60%, #1c100a 100%);
  }
  .wall::after{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse 60% 40% at 50% 55%, rgba(255,140,60,.08), transparent 70%);
    animation:wallGlow 5s ease-in-out infinite;
  }
  @keyframes wallGlow{
    0%,100%{opacity:.7}
    50%{opacity:1}
  }

  /* Floor */
  .floor{
    position:absolute;bottom:0;left:0;right:0;height:32%;
    background:
      repeating-linear-gradient(90deg,
        #2a160c 0, #2a160c 60px,
        #1f1108 60px, #1f1108 62px,
        #3a2014 62px, #3a2014 120px,
        #1f1108 120px, #1f1108 122px),
      linear-gradient(180deg, #1a0d06 0%, #0a0503 100%);
    transform:perspective(700px) rotateX(52deg);
    transform-origin:top;
  }

  /* Warm light pool on floor */
  .light-pool{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:75%;height:38%;
    background:radial-gradient(ellipse at center top, rgba(255,150,60,.45), rgba(255,100,30,.18) 35%, transparent 70%);
    mix-blend-mode:screen;
    animation:lightPulse 3.7s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes lightPulse{
    0%,100%{opacity:.85;transform:translateX(-50%) scale(1)}
    25%{opacity:1;transform:translateX(-50%) scale(1.05)}
    60%{opacity:.78;transform:translateX(-50%) scale(.98)}
  }

  /* Fireplace */
  .fireplace{
    position:absolute;bottom:22%;left:50%;transform:translateX(-50%);
    width:min(540px,72vw);height:min(440px,62vh);
  }
  .fireplace-frame{
    position:absolute;inset:0;
    background:linear-gradient(180deg,#3a2418 0%, #2a1810 100%);
    border-radius:14px 14px 4px 4px;
    box-shadow:
      inset 0 -25px 50px rgba(0,0,0,.6),
      0 30px 60px rgba(0,0,0,.7),
      0 0 80px rgba(255,120,40,.15);
  }
  .stones{position:absolute;inset:0;border-radius:14px 14px 4px 4px;overflow:hidden;display:flex;flex-direction:column}
  .stone-row{display:flex;flex:1;min-height:0}
  .stone{
    flex:1;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,180,120,.08), transparent 60%),
      linear-gradient(180deg,#4a3024,#2e1c12);
    border:2px solid #150a05;
    box-shadow:inset 0 2px 4px rgba(255,180,120,.08), inset 0 -3px 6px rgba(0,0,0,.55);
  }

  /* Fireplace opening */
  .opening{
    position:absolute;bottom:6%;left:50%;transform:translateX(-50%);
    width:72%;height:62%;
    background:radial-gradient(ellipse at center bottom, #1a0805 0%, #000 80%);
    border-radius:50% 50% 6px 6px / 28% 28% 6px 6px;
    box-shadow:
      inset 0 12px 30px rgba(0,0,0,.9),
      inset 0 -6px 24px rgba(255,100,30,.25);
    overflow:hidden;
  }
  #fireCanvas{position:absolute;inset:0;width:100%;height:100%}

  /* Logs */
  .logs{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);width:78%;height:18%;z-index:2}
  .log{
    position:absolute;
    background:
      linear-gradient(180deg, rgba(255,160,60,.15) 0%, transparent 30%),
      linear-gradient(180deg, #3a2010 0%, #1a0a04 100%);
    border-radius:50%/30%;
    box-shadow:0 -6px 24px rgba(255,120,40,.7), inset 0 -2px 4px rgba(0,0,0,.7);
  }
  .log1{bottom:18%;left:8%;width:62%;height:42%;transform:rotate(-8deg)}
  .log2{bottom:6%;left:22%;width:58%;height:36%;transform:rotate(7deg)}
  .log3{bottom:32%;left:36%;width:42%;height:30%;transform:rotate(-3deg)}

  /* Mantel */
  .mantel{
    position:absolute;top:-7%;left:-3%;right:-3%;height:11%;
    background:linear-gradient(180deg,#5a3520 0%,#3a2014 60%,#2a160c 100%);
    border-radius:4px;
    box-shadow:
      0 8px 16px rgba(0,0,0,.6),
      inset 0 2px 4px rgba(255,180,120,.18),
      inset 0 -4px 8px rgba(0,0,0,.45);
  }
  .mantel::before{
    content:'';position:absolute;top:-10px;left:4%;right:4%;height:14px;
    background:linear-gradient(180deg,#6a4028,#3a2014);
    border-radius:4px 4px 0 0;
    box-shadow:0 2px 6px rgba(0,0,0,.5);
  }

  .mantel-items{
    position:absolute;bottom:100%;left:0;right:0;height:140px;
    display:flex;align-items:flex-end;justify-content:space-around;padding:0 6%;
  }

  /* Candle */
  .candle{position:relative;width:30px;height:80px}
  .candle-body{
    position:absolute;inset:0;
    background:linear-gradient(180deg,#f4e4c8 0%,#d4b896 100%);
    border-radius:4px;
    box-shadow:inset -4px 0 6px rgba(0,0,0,.25), inset 3px 0 4px rgba(255,255,255,.15);
  }
  .candle::before{
    content:'';position:absolute;top:-3px;left:50%;transform:translateX(-50%);
    width:3px;height:7px;background:#1a0e04;border-radius:1px;
  }
  .candle-flame{
    position:absolute;top:-30px;left:50%;transform:translateX(-50%);
    width:14px;height:26px;
    background:radial-gradient(ellipse at 50% 70%, #fff5d0 0%, #ffaa30 40%, #ff6020 72%, transparent 92%);
    border-radius:50% 50% 30% 30% / 70% 70% 30% 30%;
    filter:blur(1px);
    animation:candleFlicker .5s ease-in-out infinite alternate;
    box-shadow:0 0 30px rgba(255,160,60,.7), 0 0 60px rgba(255,120,40,.4);
  }
  @keyframes candleFlicker{
    0%{transform:translateX(-50%) scale(1,1);opacity:.92}
    50%{transform:translateX(-52%) scale(.95,1.06);opacity:1}
    100%{transform:translateX(-48%) scale(1.02,.94);opacity:.96}
  }

  /* Clock */
  .clock{
    position:relative;width:78px;height:78px;border-radius:50%;
    background:radial-gradient(circle,#2a1a10 0%,#100804 100%);
    border:4px solid #6a4028;
    box-shadow:0 4px 12px rgba(0,0,0,.6), inset 0 2px 6px rgba(0,0,0,.5);
  }
  .clock::after{
    content:'';position:absolute;top:50%;left:50%;width:6px;height:6px;
    background:var(--cream);border-radius:50%;
    transform:translate(-50%,-50%);z-index:3;
  }
  .hand{position:absolute;top:50%;left:50%;background:var(--cream);transform-origin:bottom center;border-radius:2px}
  .hour{width:3px;height:20px;transform:translate(-50%,-100%)}
  .minute{width:2px;height:28px;transform:translate(-50%,-100%)}
  .clock-mark{position:absolute;width:2px;height:5px;background:var(--cream);left:50%;top:4px;transform-origin:50% 35px;opacity:.6}

  /* Books */
  .books{display:flex;align-items:flex-end;height:70px}
  .book{width:14px;margin-right:2px;box-shadow:inset -2px 0 3px rgba(0,0,0,.4), inset 2px 0 3px rgba(255,255,255,.08)}
  .book.b1{height:60px;background:linear-gradient(180deg,#7a2818,#4a1208)}
  .book.b2{height:72px;background:linear-gradient(180deg,#3a4828,#1a2818)}
  .book.b3{height:55px;background:linear-gradient(180deg,#8a6820,#5a3810)}
  .book.b4{height:65px;background:linear-gradient(180deg,#6a2828,#3a1010)}

  /* Vase */
  .vase{position:relative;width:40px;height:90px}
  .vase-body{
    position:absolute;bottom:0;width:100%;height:55px;
    background:linear-gradient(180deg,#3a1818 0%,#1a0808 100%);
    border-radius:40% 40% 50% 50% / 20% 20% 50% 50%;
    box-shadow:inset -4px 0 6px rgba(0,0,0,.4), inset 4px 0 6px rgba(255,200,150,.1);
  }
  .branch{position:absolute;bottom:50px;left:50%;width:2px;background:#3a2418;transform-origin:bottom center}
  .branch::after{content:'';position:absolute;top:-3px;left:-2px;width:6px;height:6px;background:#4a3220;border-radius:50%}
  .branch1{height:50px;transform:translateX(-50%) rotate(-18deg)}
  .branch2{height:62px;transform:translateX(-50%) rotate(10deg)}
  .branch3{height:44px;transform:translateX(-50%) rotate(-4deg)}

  /* Window */
  .window{
    position:absolute;top:10%;right:5%;
    width:min(230px,22vw);height:min(290px,38vh);
    background:linear-gradient(180deg,#0a0814 0%,#050308 100%);
    border:8px solid #2a1810;
    box-shadow:0 12px 30px rgba(0,0,0,.7), inset 0 0 40px rgba(0,0,0,.8);
    overflow:hidden;
  }
  .window::before,.window::after{content:'';position:absolute;background:#2a1810;box-shadow:0 0 4px rgba(0,0,0,.8)}
  .window::before{top:0;bottom:0;left:50%;width:4px;transform:translateX(-50%)}
  .window::after{left:0;right:0;top:50%;height:4px;transform:translateY(-50%)}
  .moon{
    position:absolute;top:14%;right:18%;width:42px;height:42px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#f4e8d0,#c8b890);
    box-shadow:0 0 30px rgba(244,232,208,.45), 0 0 60px rgba(244,232,208,.2);
  }
  #rainCanvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}

  /* Side table + mug */
  .side-table{position:absolute;bottom:18%;left:5%;width:110px;height:90px;z-index:3}
  .table-top{
    position:absolute;top:0;width:100%;height:12px;
    background:linear-gradient(180deg,#4a2818 0%,#2a1408 100%);
    border-radius:4px;box-shadow:0 4px 10px rgba(0,0,0,.5);
  }
  .table-leg{position:absolute;top:12px;width:6px;height:78px;background:linear-gradient(180deg,#3a1c10,#1a0a04)}
  .table-leg.l{left:8px}.table-leg.r{right:8px}

  .mug{
    position:absolute;top:-42px;left:50%;transform:translateX(-50%);
    width:38px;height:46px;
    background:linear-gradient(180deg,#e8d8c0 0%,#b89878 100%);
    border-radius:4px 4px 18px 18px;
    box-shadow:inset -4px 0 6px rgba(0,0,0,.3), 0 4px 10px rgba(0,0,0,.5);
  }
  .mug::before{content:'';position:absolute;top:4px;left:4px;right:4px;height:6px;background:#3a1a08;border-radius:50%}
  .mug::after{
    content:'';position:absolute;right:-9px;top:8px;width:13px;height:22px;
    border:3px solid #d8c0a0;border-left:none;border-radius:0 12px 12px 0;
  }
  .steam{position:absolute;top:-70px;left:50%;transform:translateX(-50%);width:30px;height:60px;pointer-events:none}
  .steam-puff{
    position:absolute;bottom:0;left:50%;width:14px;height:14px;
    background:radial-gradient(circle,rgba(255,240,220,.55),transparent 70%);
    border-radius:50%;transform:translateX(-50%);
    animation:steamRise 3.2s ease-out infinite;opacity:0;
  }
  .steam-puff:nth-child(2){animation-delay:.9s}
  .steam-puff:nth-child(3){animation-delay:1.8s}
  .steam-puff:nth-child(4){animation-delay:2.5s}
  @keyframes steamRise{
    0%{transform:translateX(-50%) translateY(0) scale(.5);opacity:0}
    20%{opacity:.85}
    100%{transform:translateX(-50%) translateY(-60px) scale(2.4);opacity:0}
  }

  /* Rug */
  .rug{
    position:absolute;bottom:3%;left:50%;transform:translateX(-50%);
    width:62%;height:16%;
    background:
      repeating-linear-gradient(90deg,#6a2818 0,#6a2818 12px,#8a3828 12px,#8a3828 24px),
      linear-gradient(180deg,#5a1810 0%,#3a0a08 100%);
    border-radius:4px;
    box-shadow:0 12px 24px rgba(0,0,0,.6);
    border:8px solid #3a1208;
    z-index:1;
  }
  .rug::before{content:'';position:absolute;inset:8px;border:3px solid #c8a060;opacity:.45;border-radius:2px}

  /* Title */
  .title{position:absolute;top:6%;left:6%;z-index:10;pointer-events:none}
  .title h1{
    font-family:'Cormorant Garamond',serif;font-weight:300;
    font-size:clamp(28px,4.2vw,52px);letter-spacing:.12em;
    color:var(--cream);opacity:.92;line-height:1;
  }
  .title h1 em{font-style:italic;font-weight:500;color:var(--ember)}
  .title p{
    font-size:11px;letter-spacing:.45em;text-transform:uppercase;
    color:rgba(244,228,200,.5);margin-top:10px;
  }
  .title .divider{
    width:60px;height:1px;background:linear-gradient(90deg,var(--ember),transparent);
    margin-top:14px;
  }

  /* Info */
  .info{position:absolute;bottom:6%;right:6%;z-index:10;text-align:right;pointer-events:none}
  .info .temp{
    font-family:'Cormorant Garamond',serif;font-size:clamp(36px,5vw,56px);
    font-weight:300;color:var(--ember);line-height:1;
    text-shadow:0 0 30px rgba(255,180,80,.4);
  }
  .info .label{
    font-size:10px;letter-spacing:.4em;text-transform:uppercase;
    color:rgba(244,228,200,.55);margin-top:8px;
  }
  .info .meta{
    font-size:9px;letter-spacing:.3em;text-transform:uppercase;
    color:rgba(244,228,200,.35);margin-top:14px;
    font-family:'Outfit',sans-serif;
  }

  /* Vignette */
  .vignette{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.75) 100%);
    pointer-events:none;z-index:5;
  }

  /* Heat shimmer above fire */
  .shimmer{
    position:absolute;top:-12%;left:50%;transform:translateX(-50%);
    width:85%;height:32%;
    background:radial-gradient(ellipse at center bottom, rgba(255,180,80,.18), transparent 70%);
    filter:blur(8px);
    animation:shimmerWave 3s ease-in-out infinite;
    pointer-events:none;mix-blend-mode:screen;
  }
  @keyframes shimmerWave{
    0%,100%{opacity:.6;transform:translateX(-50%) scaleX(1)}
    50%{opacity:1;transform:translateX(-50%) scaleX(1.12)}
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001s !important;animation-iteration-count:1 !important}
  }

  @media (max-width:640px){
    .title h1{font-size:22px;letter-spacing:.1em}
    .title p{font-size:9px}
    .window{width:130px;height:180px;right:3%;top:8%}
    .moon{width:28px;height:28px}
    .side-table{left:3%;width:80px;height:70px}
    .mug{width:30px;height:36px;top:-34px}
    .info .temp{font-size:30px}
    .info .label{font-size:8px}
    .mantel-items{padding:0 2%;height:100px}
    .clock{width:48px;height:48px;border-width:3px}
    .hour{height:12px}.minute{height:18px}
    .clock-mark{transform-origin:50% 20px;height:4px}
    .candle{width:20px;height:50px}
    .candle-flame{width:10px;height:18px;top:-20px}
    .vase{width:28px;height:60px}
    .vase-body{height:36px}
    .branch1{height:32px;bottom:36px}.branch2{height:40px;bottom:36px}.branch3{height:28px;bottom:36px}
    .books{height:48px}
    .book{width:9px}
    .fireplace{height:min(360px,55vh)}
  }
</style>
</head>
<body>
<div class="scene">
  <div class="wall"></div>
  <div class="floor"></div>
  <div class="light-pool"></div>

  <header class="title">
    <h1>Hearth <em>&</em> Home</h1>
    <p>A Quiet Evening</p>
    <div class="divider"></div>
  </header>

  <aside class="window" aria-label="Window with night rain">
    <div class="moon"></div>
    <canvas id="rainCanvas"></canvas>
  </aside>

  <main class="fireplace">
    <div class="fireplace-frame">
      <div class="stones">
        <div class="stone-row">
          <div class="stone"></div><div class="stone"></div><div class="stone"></div><div class="stone"></div>
        </div>
        <div class="stone-row">
          <div class="stone" style="flex:.6"></div><div class="stone"></div><div class="stone" style="flex:.8"></div><div class="stone"></div><div class="stone" style="flex:.5"></div>
        </div>
        <div class="stone-row">
          <div class="stone"></div><div class="stone" style="flex:.7"></div><div class="stone"></div><div class="stone"></div>
        </div>
        <div class="stone-row">
          <div class="stone" style="flex:.5"></div><div class="stone"></div><div class="stone" style="flex:.6"></div><div class="stone"></div>
        </div>
      </div>
    </div>

    <div class="mantel">
      <div class="mantel-items">
        <div class="candle">
          <div class="candle-flame"></div>
          <div class="candle-body"></div>
        </div>

        <div class="clock" id="clock">
          <div class="clock-mark" style="transform:rotate(0deg)"></div>
          <div class="clock-mark" style="transform:rotate(90deg)"></div>
          <div class="clock-mark" style="transform:rotate(180deg)"></div>
          <div class="clock-mark" style="transform:rotate(270deg)"></div>
          <div class="hand hour" id="hourHand"></div>
          <div class="hand minute" id="minuteHand"></div>
        </div>

        <div class="books">
          <div class="book b1"></div>
          <div class="book b2"></div>
          <div class="book b3"></div>
          <div class="book b4"></div>
        </div>

        <div class="vase">
          <div class="branch branch1"></div>
          <div class="branch branch2"></div>
          <div class="branch branch3"></div>
          <div class="vase-body"></div>
        </div>
      </div>
    </div>

    <div class="opening">
      <canvas id="fireCanvas"></canvas>
      <div class="shimmer"></div>
      <div class="logs">
        <div class="log log1"></div>
        <div class="log log2"></div>
        <div class="log log3"></div>
      </div>
    </div>
  </main>

  <aside class="side-table">
    <div class="table-top"></div>
    <div class="table-leg l"></div>
    <div class="table-leg r"></div>
    <div class="mug">
      <div class="steam">
        <div class="steam-puff"></div>
        <div class="steam-puff"></div>
        <div class="steam-puff"></div>
        <div class="steam-puff"></div>
      </div>
    </div>
  </aside>

  <footer class="info">
    <div class="temp" id="temp">72°</div>
    <div class="label">Indoor · Cozy</div>
    <div class="meta" id="timeLabel">— : —</div>
  </footer>

  <div class="vignette"></div>
</div>

<script>
  /* ============================================================
     FIRE — particle-based flames + embers, additive blending
     ============================================================ */
  const fireCanvas = document.getElementById('fireCanvas');
  const fctx = fireCanvas.getContext('2d');
  let fw = 0, fh = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resizeFire(){
    const rect = fireCanvas.getBoundingClientRect();
    fw = rect.width; fh = rect.height;
    fireCanvas.width = fw * dpr;
    fireCanvas.height = fh * dpr;
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // Flame particle — soft radial blob that rises, shrinks, shifts color
  class Flame {
    constructor(){ this.reset(true); }
    reset(initial){
      this.x = fw/2 + (Math.random()-0.5) * fw * 0.55;
      this.y = fh - fh*0.12 - Math.random()*10;
      this.vx = (Math.random()-0.5) * 0.35;
      this.vy = -0.7 - Math.random() * 1.3;
      this.size = (22 + Math.random()*38) * (initial ? Math.random() : 1);
      this.life = initial ? Math.random() : 1;
      this.decay = 0.006 + Math.random() * 0.009;
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = 0.04 + Math.random()*0.05;
    }
    update(){
      this.wobble += this.wobbleSpeed;
      this.x += this.vx + Math.sin(this.wobble) * 0.4;
      this.y += this.vy;
      this.vy *= 0.991;
      this.size *= 0.984;
      this.life -= this.decay;
      if (this.life <= 0 || this.size < 2) this.reset(false);
    }
    draw(ctx){
      const r = Math.max(1, this.size);
      const t = 1 - this.life; // 0 at birth, 1 at death
      let cr, cg, cb, ca;
      if (t < 0.25){       // hot white-yellow core
        cr=255; cg=240; cb=185; ca=0.55*this.life;
      } else if (t < 0.55){ // bright orange
        cr=255; cg=150; cb=55; ca=0.48*this.life;
      } else if (t < 0.8){  // deep orange-red
        cr=230; cg=80; cb=25; ca=0.38*this.life;
      } else {              // smoky red, fading
        cr=140; cg=35; cb=15; ca=0.22*this.life;
      }
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
      g.addColorStop(0, `rgba(${cr},${cg},${cb},${ca})`);
      g.addColorStop(0.5, `rgba(${cr},${cg},${cb},${ca*0.4})`);
      g.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // Ember — bright spark drifting up with horizontal sway
  class Ember {
    constructor(){ this.reset(true); }
    reset(initial){
      this.x = fw/2 + (Math.random()-0.5) * fw * 0.5;
      this.y = initial ? Math.random() * fh * 0.8 : fh - fh*0.1 - Math.random()*15;
      this.vx = (Math.random()-0.5) * 0.4;
      this.vy = -0.6 - Math.random() * 1.6;
      this.size = 1 + Math.random() * 1.8;
      this.life = initial ? Math.random() : 1;
      this.decay = 0.003 + Math.random() * 0.006;
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = 0.03 + Math.random() * 0.06;
      this.bright = 0.7 + Math.random() * 0.3;
    }
    update(){
      this.wobble += this.wobbleSpeed;
      this.x += this.vx + Math.sin(this.wobble) * 0.5;
      this.y += this.vy;
      this.vy *= 0.998;
      this.life -= this.decay;
      if (this.life <= 0 || this.y < -10) this.reset(false);
    }
    draw(ctx){
      const a = this.life * this.bright;
      // glow halo
      const r = this.size * 4;
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
      g.addColorStop(0, `rgba(255,200,120,${a*0.55})`);
      g.addColorStop(1, 'rgba(255,200,120,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, Math.PI*2);
      ctx.fill();
      // bright core
      ctx.fillStyle = `rgba(255,${180+Math.floor(this.life*60)},${90+Math.floor(this.life*50)},${a})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
      ctx.fill();
    }
  }

  let flames = [], embers = [];
  function initFire(){
    resizeFire();
    flames = []; embers = [];
    const flameCount = Math.max(30, Math.floor(fw * fh / 220));
    const emberCount = Math.max(20, Math.floor(fw * fh / 350));
    for (let i = 0; i < flameCount; i++) flames.push(new Flame());
    for (let i = 0; i < emberCount; i++) embers.push(new Ember());
  }

  let fireTime = 0;
  function renderFire(){
    // soft trailing fade
    fctx.globalCompositeOperation = 'source-over';
    fctx.fillStyle = 'rgba(8,3,1,0.28)';
    fctx.fillRect(0, 0, fw, fh);

    // pulsing base glow under logs
    const pulse = 0.75 + Math.sin(fireTime*0.05)*0.12 + Math.sin(fireTime*0.13)*0.08;
    const baseGlow = fctx.createRadialGradient(fw/2, fh*0.9, 0, fw/2, fh*0.9, fw*0.7);
    baseGlow.addColorStop(0, `rgba(255,150,55,${0.55*pulse})`);
    baseGlow.addColorStop(0.4, `rgba(255,90,25,${0.22*pulse})`);
    baseGlow.addColorStop(1, 'rgba(0,0,0,0)');
    fctx.fillStyle = baseGlow;
    fctx.fillRect(0, 0, fw, fh);

    // additive flames + embers
    fctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < flames.length; i++){ flames[i].update(); flames[i].draw(fctx); }
    for (let i = 0; i < embers.length; i++){ embers[i].update(); embers[i].draw(fctx); }

    fireTime++;
    requestAnimationFrame(renderFire);
  }

  /* ============================================================
     RAIN — diagonal streaks in the window
     ============================================================ */
  const rainCanvas = document.getElementById('rainCanvas');
  const rctx = rainCanvas.getContext('2d');
  let rw = 0, rh = 0;
  const drops = [];

  function resizeRain(){
    const rect = rainCanvas.getBoundingClientRect();
    rw = rect.width; rh = rect.height;
    rainCanvas.width = rw * dpr;
    rainCanvas.height = rh * dpr;
    rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function initRain(){
    resizeRain();
    drops.length = 0;
    const n = Math.floor(rw * rh / 600);
    for (let i = 0; i < n; i++){
      drops.push({
        x: Math.random()*rw,
        y: Math.random()*rh,
        len: 7 + Math.random()*11,
        speed: 3.5 + Math.random()*4,
        opacity: 0.2 + Math.random()*0.45
      });
    }
  }
  function renderRain(){
    rctx.clearRect(0,0,rw,rh);
    rctx.lineWidth = 1;
    for (let i = 0; i < drops.length; i++){
      const d = drops[i];
      rctx.strokeStyle = `rgba(190,210,230,${d.opacity})`;
      rctx.beginPath();
      rctx.moveTo(d.x, d.y);
      rctx.lineTo(d.x - 1.5, d.y + d.len);
      rctx.stroke();
      d.y += d.speed;
      d.x -= 0.35;
      if (d.y > rh){ d.y = -d.len; d.x = Math.random()*rw + 10; }
    }
    requestAnimationFrame(renderRain);
  }

  /* ============================================================
     CLOCK — real time, smooth hour/minute hands
     ============================================================ */
  function updateClock(){
    const now = new Date();
    const h = now.getHours() % 12;
    const m = now.getMinutes();
    const s = now.getSeconds();
    const hourDeg = h*30 + m*0.5;
    const minDeg = m*6 + s*0.1;
    document.getElementById('hourHand').style.transform = `translate(-50%,-100%) rotate(${hourDeg}deg)`;
    document.getElementById('minuteHand').style.transform = `translate(-50%,-100%) rotate(${minDeg}deg)`;
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('timeLabel').textContent = `${hh} : ${mm}`;
  }

  /* ============================================================
     INIT + RESIZE
     ============================================================ */
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { initFire(); initRain(); }, 120);
  });

  initFire();
  initRain();
  renderFire();
  renderRain();
  updateClock();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
