<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ethereal Flux</title>
    <style>
        :root {
            --bg-color: #050505;
            --ui-bg: rgba(255, 255, 255, 0.1);
            --ui-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
            --accent-color: #00f2ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            height: 100vh;
            width: 100vw;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            touch-action: none; /* Prevents scrolling on mobile */
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            z-index: 10;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: none; /* Let clicks pass through empty spaces */
        }

        .controls {
            background: var(--ui-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--ui-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s ease;
        }

        .info-panel {
            text-align: center;
            pointer-events: auto;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        p {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 5px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--ui-border);
            color: white;
            padding: 10px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.3);
        }

        button.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-color);
        }

        /* Vignette effect */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 40%, #000000 120%);
            z-index: 5;
        }

        /* Toast Notification */
        .toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
            border: 1px solid var(--ui-border);
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

    </style>
</head>
<body>

    <div class="vignette"></div>
    <div class="toast" id="toast">Theme Changed</div>

    <canvas id="canvas"></canvas>

    <div class="ui-layer">
        <div class="info-panel">
            <h1>Ethereal Flux</h1>
            <p>Touch and drag to interact</p>
        </div>

        <div class="controls">
            <div class="btn-group">
                <button id="btn-theme-1" onclick="setTheme(1)">Neon</button>
                <button id="btn-theme-2" onclick="setTheme(2)">Magma</button>
                <button id="btn-theme-3" onclick="setTheme(3)">Forest</button>
            </div>
            <button id="btn-pause" onclick="togglePause()">Pause</button>
        </div>
    </div>

    <script>
        /**
         * ETHereal Flux
         * A generative particle system using HTML5 Canvas.
         * Concept: Fluid-like bioluminescence that reacts to cursor/touch.
         */

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const toast = document.getElementById('toast');
        const btnPause = document.getElementById('btn-pause');

        let width, height;
        let particles = [];
        let animationId;
        let isPaused = false;
        let mouse = { x: -1000, y: -1000, active: false };
        let theme = 1; // Default theme
        
        // Configuration per theme
        const themes = {
            1: { baseHue: 180, spread: 60, speed: 1, glow: 20 }, // Cyan/Blue
            2: { baseHue: 10, spread: 40, speed: 1.5, glow: 25 }, // Red/Orange
            3: { baseHue: 100, spread: 50, speed: 0.8, glow: 15 }  // Green/Nature
        };

        // Resize Handling
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }

        window.addEventListener('resize', resize);

        // Interaction Handling
        function handleInput(x, y) {
            mouse.x = x;
            mouse.y = y;
            mouse.active = true;
            
            // Create a burst of particles on touch/move start
            for(let i=0; i<3; i++) {
                particles.push(new Particle(x, y, true));
            }
        }

        window.addEventListener('mousemove', (e) => handleInput(e.clientX, e.clientY));
        window.addEventListener('touchstart', (e) => {
            handleInput(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});
        
        window.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Stop scrolling
            handleInput(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});

        window.addEventListener('touchend', () => {
            mouse.active = false;
            mouse.x = -1000;
            mouse.y = -1000;
        });

        // Particle Class
        class Particle {
            constructor(x, y, isBurst = false) {
                this.init(x, y, isBurst);
            }

            init(x, y, isBurst) {
                const t = themes[theme];
                
                // Position
                this.x = x || Math.random() * width;
                this.y = y || Math.random() * height;
                
                // Velocity
                const angle = Math.random() * Math.PI * 2;
                const velocity = isBurst ? Math.random() * 5 + 2 : Math.random() * 1 + 0.2;
                this.vx = Math.cos(angle) * velocity;
                this.vy = Math.sin(angle) * velocity;
                
                // Physics properties
                this.friction = 0.96;
                this.gravity = 0.02; // Slight downward drift
                this.life = 1.0;
                this.decay = Math.random() * 0.005 + 0.002;
                
                // Appearance
                this.size = Math.random() * 4 + 1;
                this.hueOffset = Math.random() * t.spread;
                this.hue = t.baseHue + this.hueOffset;
                this.alpha = Math.random() * 0.5 + 0.3;
            }

            update() {
                // Apply forces
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;

                // Mouse/Touch Interaction (Repulsion/Attraction)
                if (mouse.active) {
                    const dx = this.x - mouse.x;
                    const dy = this.y - mouse.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const maxDist = 200;

                    if (distance < maxDist) {
                        const force = (maxDist - distance) / maxDist;
                        const angle = Math.atan2(dy, dx);
                        
                        // Push away logic
                        this.vx += Math.cos(angle) * force * 0.8;
                        this.vy += Math.sin(angle) * force * 0.8;
                        
                        // Add energy
                        this.life = Math.min(this.life + 0.05, 1.5);
                    }
                }

                // Move
                this.x += this.vx * themes[theme].speed;
                this.y += this.vy * themes[theme].speed;

                // Fade out
                this.life -= this.decay;
                this.alpha = this.life * 0.6;
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 80%, 60%, ${this.alpha})`;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.min((width * height) / 4000, 300); // Responsive count
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        // Animation Loop
        function animate() {
            if (!isPaused) {
                // Trail effect: instead of clearing, draw semi-transparent black
                ctx.fillStyle = 'rgba(5, 5, 5, 0.15)';
                ctx.fillRect(0, 0, width, height);

                // Set blend mode for glowing effect
                ctx.globalCompositeOperation = 'lighter';

                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw(ctx);

                    // Remove dead particles
                    if (particles[i].life <= 0) {
                        particles.splice(i, 1);
                        i--;
                        // Add new particles to maintain density
                        particles.push(new Particle(
                            Math.random() * width, 
                            Math.random() * height
                        ));
                    }
                }

                // Reset blend mode for next frame (vignette etc)
                ctx.globalCompositeOperation = 'source-over';
            }
            animationId = requestAnimationFrame(animate);
        }

        // UI Logic
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        window.setTheme = function(id) {
            theme = id;
            
            // Update active button state
            [1, 2, 3].forEach(i => {
                const btn = document.getElementById(`btn-theme-${i}`);
                if(i === id) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            showToast(`Theme: ${id === 1 ? 'Neon' : id === 2 ? 'Magma' : 'Forest'}`);
            
            // Flash effect on change
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.fillRect(0,0,width,height);
        };

        window.togglePause = function() {
            isPaused = !isPaused;
            btnPause.textContent = isPaused ? "Play" : "Pause";
            btnPause.classList.toggle('active', isPaused);
        };

        // Initialize
        resize();
        animate();
        setTheme(1); // Set default active state

    </script>
</body>
</html>
