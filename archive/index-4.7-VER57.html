<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 塔防防御战</title>
    <style>
        :root {
            --bg-color: #2c3e50;
            --ui-bg: rgba(0, 0, 0, 0.85);
            --accent-color: #e74c3c;
            --text-color: #ecf0f1;
            --highlight: #f1c40f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* 防止双击选中文本 */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 游戏主容器 */
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background-color: #27ae60; /* 草地绿 */
            cursor: crosshair;
        }

        /* 顶部 HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            font-size: 18px;
            font-weight: bold;
            pointer-events: none; /* 让点击穿透到 Canvas */
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon { font-size: 20px; }
        .lives { color: #e74c3c; }
        .money { color: #f1c40f; }
        .wave { color: #3498db; }

        /* 底部建造菜单 */
        #build-menu {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: var(--ui-bg);
            padding: 10px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tower-btn {
            background: transparent;
            border: 2px solid transparent;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            position: relative;
        }

        .tower-btn:hover { background: rgba(255,255,255,0.1); }
        .tower-btn.active { border-color: var(--highlight); transform: scale(1.1); }
        .tower-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

        .tower-btn .cost {
            position: absolute;
            bottom: -20px;
            font-size: 12px;
            color: #f1c40f;
        }

        .tower-btn .name {
            font-size: 10px;
            margin-top: 2px;
            color: #ccc;
        }

        /* 模态框 (开始/结束/暂停) */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--ui-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            transition: opacity 0.3s;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 { font-size: 48px; margin-bottom: 10px; color: var(--highlight); text-shadow: 2px 2px 0 #000; }
        h2 { font-size: 32px; margin-bottom: 20px; }
        p { margin-bottom: 30px; max-width: 400px; line-height: 1.5; color: #bdc3c7; }

        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            transition: transform 0.1s, background 0.2s;
            font-weight: bold;
        }

        .btn:hover { background: #c0392b; transform: translateY(-2px); }
        .btn:active { transform: translateY(1px); }

        /* Toast 提示 */
        #toast {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <main id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <!-- HUD -->
        <div id="hud">
            <div class="hud-item"><span class="icon">❤️</span> <span id="lives-display" class="lives">20</span></div>
            <div class="hud-item"><span class="icon">💰</span> <span id="money-display" class="money">100</span></div>
            <div class="hud-item"><span class="icon">🌊</span> <span id="wave-display" class="wave">第 1 波</span></div>
        </div>

        <!-- 底部建造菜单 -->
        <div id="build-menu">
            <button class="tower-btn active" onclick="selectTower('basic')" id="btn-basic">
                <div style="width: 20px; height: 20px; background: #3498db; border-radius: 4px;"></div>
                <span class="name">基础</span>
                <span class="cost">50</span>
            </button>
            <button class="tower-btn" onclick="selectTower('sniper')" id="btn-sniper">
                <div style="width: 20px; height: 20px; background: #8e44ad; border-radius: 50%;"></div>
                <span class="name">狙击</span>
                <span class="cost">120</span>
            </button>
            <button class="tower-btn" onclick="selectTower('rapid')" id="btn-rapid">
                <div style="width: 20px; height: 20px; background: #e67e22; border-radius: 50%;"></div>
                <span class="name">速射</span>
                <span class="cost">80</span>
            </button>
        </div>

        <!-- 开始界面 -->
        <div id="start-screen" class="modal">
            <h1>塔防防御战</h1>
            <p>敌人将从左侧路径涌来。在地图上建造防御塔来阻止它们。</p>
            <p><strong>基础塔</strong>: 平衡<br><strong>狙击塔</strong>: 范围大，伤害高<br><strong>速射塔</strong>: 射速快，范围小</p>
            <button class="btn" onclick="startGame()">开始游戏</button>
        </div>

        <!-- 游戏结束界面 -->
        <div id="game-over-screen" class="modal hidden">
            <h1 id="end-title">游戏结束</h1>
            <h2 id="end-score">生存波数: 0</h2>
            <button class="btn" onclick="resetGame()">重新开始</button>
        </div>

        <!-- 消息提示 -->
        <div id="toast">提示信息</div>
    </main>

<script>
/**
 * 游戏配置与常量
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const TILE_SIZE = 40;
const COLS = canvas.width / TILE_SIZE;
const ROWS = canvas.height / TILE_SIZE;

// 游戏状态
let gameState = {
    lives: 20,
    money: 120,
    wave: 1,
    isPlaying: false,
    selectedTower: 'basic', // basic, sniper, rapid
    enemies: [],
    towers: [],
    projectiles: [],
    particles: [],
    path: [], // 敌人路径点
    waveInProgress: false,
    enemiesToSpawn: 0,
    spawnTimer: 0,
    frameCount: 0
};

// 塔的定义
const TOWER_TYPES = {
    basic: { name: '基础塔', cost: 50, range: 120, damage: 20, fireRate: 40, color: '#3498db', projectileColor: '#fff', speed: 5 },
    sniper: { name: '狙击塔', cost: 120, range: 250, damage: 100, fireRate: 90, color: '#8e44ad', projectileColor: '#d2b4de', speed: 12 },
    rapid: { name: '速射塔', cost: 80, range: 100, damage: 8, fireRate: 10, color: '#e67e22', projectileColor: '#f1c40f', speed: 8 }
};

// 初始化地图路径 (简单的S型路径)
function initPath() {
    gameState.path = [
        {x: 0, y: 2}, {x: 5, y: 2}, {x: 5, y: 8}, {x: 12, y: 8}, 
        {x: 12, y: 4}, {x: 18, y: 4}, {x: 18, y: 10}, {x: 8, y: 10}, 
        {x: 8, y: 14}, {x: 20, y: 14}
    ];
}

/**
 * 类定义
 */

class Enemy {
    constructor(wave) {
        this.pathIndex = 0;
        // 转换网格坐标到像素坐标
        const startTile = gameState.path[0];
        this.x = startTile.x * TILE_SIZE + TILE_SIZE / 2;
        this.y = startTile.y * TILE_SIZE + TILE_SIZE / 2;
        
        // 属性随波次增强
        this.maxHealth = 30 + (wave * 15);
        this.health = this.maxHealth;
        this.speed = 1.5 + (wave * 0.1); // 稍微变快
        this.reward = 10 + Math.floor(wave / 5);
        this.radius = 12;
        this.frozen = 0;
    }

    update() {
        // 移动逻辑
        const targetTile = gameState.path[this.pathIndex + 1];
        if (!targetTile) return; // 到达终点

        const targetX = targetTile.x * TILE_SIZE + TILE_SIZE / 2;
        const targetY = targetTile.y * TILE_SIZE + TILE_SIZE / 2;

        const dx = targetX - this.x;
        const dy = targetY - this.y;
        const distance = Math.hypot(dx, dy);

        if (distance < this.speed) {
            // 到达节点，前往下一个
            this.x = targetX;
            this.y = targetY;
            this.pathIndex++;
            if (this.pathIndex >= gameState.path.length - 1) {
                this.reachEnd();
            }
        } else {
            // 移动
            this.x += (dx / distance) * this.speed;
            this.y += (dy / distance) * this.speed;
        }
    }

    draw() {
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        
        // 血条
        const hpPercent = this.health / this.maxHealth;
        ctx.fillStyle = 'red';
        ctx.fillRect(this.x - 10, this.y - 20, 20, 4);
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(this.x - 10, this.y - 20, 20 * hpPercent, 4);
    }

    takeDamage(amount) {
        this.health -= amount;
        if (this.health <= 0) {
            gameState.money += this.reward;
            updateHUD();
            createParticles(this.x, this.y, '#e74c3c', 5);
        }
    }

    reachEnd() {
        gameState.lives--;
        updateHUD();
        createParticles(this.x, this.y, '#c0392b', 10);
        if (gameState.lives <= 0) {
            endGame();
        }
    }
}

class Tower {
    constructor(col, row, type) {
        this.col = col;
        this.row = row;
        this.x = col * TILE_SIZE + TILE_SIZE / 2;
        this.y = row * TILE_SIZE + TILE_SIZE / 2;
        this.type = type;
        const stats = TOWER_TYPES[type];
        this.range = stats.range;
        this.damage = stats.damage;
        this.fireRate = stats.fireRate; // 帧数间隔
        this.color = stats.color;
        this.cooldown = 0;
        this.angle = 0;
    }

    update() {
        if (this.cooldown > 0) this.cooldown--;

        // 寻找目标
        const target = this.findTarget();
        if (target) {
            // 旋转炮台朝向目标
            const dx = target.x - this.x;
            const dy = target.y - this.y;
            this.angle = Math.atan2(dy, dx);

            if (this.cooldown <= 0) {
                this.shoot(target);
                this.cooldown = this.fireRate;
            }
        }
    }

    findTarget() {
        // 简单的最近目标逻辑
        let closest = null;
        let minDist = Infinity;

        for (const enemy of gameState.enemies) {
            const dist = Math.hypot(enemy.x - this.x, enemy.y - this.y);
            if (dist <= this.range && dist < minDist) {
                minDist = dist;
                closest = enemy;
            }
        }
        return closest;
    }

    shoot(target) {
        const stats = TOWER_TYPES[this.type];
        gameState.projectiles.push(new Projectile(this.x, this.y, target, this.damage, stats.speed, stats.projectileColor));
    }

    draw() {
        // 底座
        ctx.fillStyle = '#7f8c8d';
        ctx.fillRect(this.col * TILE_SIZE + 5, this.row * TILE_SIZE + 5, TILE_SIZE - 10, TILE_SIZE - 10);
        
        // 炮台主体
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = this.color;
        ctx.fillRect(-10, -10, 25, 20); // 炮管
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2); // 中心
        ctx.fill();
        ctx.restore();
    }
}

class Projectile {
    constructor(x, y, target, damage, speed, color) {
        this.x = x;
        this.y = y;
        this.target = target;
        this.damage = damage;
        this.speed = speed;
        this.color = color;
        this.active = true;
        this.radius = 4;
    }

    update() {
        if (!this.target || this.target.health <= 0) {
            this.active = false;
            return;
        }

        const dx = this.target.x - this.x;
        const dy = this.target.y - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist < this.speed) {
            // 击中
            this.target.takeDamage(this.damage);
            this.active = false;
            createParticles(this.x, this.y, this.color, 3);
        } else {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
    }

    draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.size = Math.random() * 3 + 2;
        this.speedX = (Math.random() - 0.5) * 4;
        this.speedY = (Math.random() - 0.5) * 4;
        this.life = 1.0; // 透明度
        this.decay = Math.random() * 0.05 + 0.02;
    }

    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.life -= this.decay;
    }

    draw() {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

/**
 * 游戏逻辑控制
 */

function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        gameState.particles.push(new Particle(x, y, color));
    }
}

function spawnWave() {
    gameState.waveInProgress = true;
    gameState.enemiesToSpawn = 5 + Math.floor(gameState.wave * 1.5);
    gameState.spawnTimer = 0;
    showToast(`第 ${gameState.wave} 波敌人来袭!`);
}

function updateWaveLogic() {
    if (gameState.enemiesToSpawn > 0) {
        gameState.spawnTimer++;
        // 间隔生成
        if (gameState.spawnTimer > 60) { // 每秒生成一个 (假设60fps)
            gameState.enemies.push(new Enemy(gameState.wave));
            gameState.enemiesToSpawn--;
            gameState.spawnTimer = 0;
        }
    } else if (gameState.enemies.length === 0 && gameState.waveInProgress) {
        // 波次结束
        gameState.waveInProgress = false;
        gameState.wave++;
        gameState.money += 30 + (gameState.wave * 5); // 波次奖励
        updateHUD();
        showToast("波次完成! 获得奖励金钱。");
    }
}

function drawMap() {
    // 绘制路径
    ctx.fillStyle = '#95a5a6'; // 路径颜色
    ctx.strokeStyle = '#7f8c8d';
    ctx.lineWidth = TILE_SIZE - 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.beginPath();
    const start = gameState.path[0];
    ctx.moveTo(start.x * TILE_SIZE + TILE_SIZE/2, start.y * TILE_SIZE + TILE_SIZE/2);
    
    for (let i = 1; i < gameState.path.length; i++) {
        const p = gameState.path[i];
        ctx.lineTo(p.x * TILE_SIZE + TILE_SIZE/2, p.y * TILE_SIZE + TILE_SIZE/2);
    }
    ctx.stroke();

    // 绘制起点终点标记
    // 简单的起点圆圈
    ctx.fillStyle = '#2ecc71';
    ctx.beginPath();
    ctx.arc(20, gameState.path[0].y * TILE_SIZE + TILE_SIZE/2, 10, 0, Math.PI*2);
    ctx.fill();

    // 终点
    const end = gameState.path[gameState.path.length-1];
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(end.x * TILE_SIZE + TILE_SIZE/2, end.y * TILE_SIZE + TILE_SIZE/2, 10, 0, Math.PI*2);
    ctx.fill();
}

function drawGridAndPreview(mouseX, mouseY) {
    // 绘制网格线
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= canvas.width; x += TILE_SIZE) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y <= canvas.height; y += TILE_SIZE) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // 鼠标悬停预览
    if (gameState.isPlaying) {
        const col = Math.floor(mouseX / TILE_SIZE);
        const row = Math.floor(mouseY / TILE_SIZE);
        
        // 检查是否在路径上或已有塔
        if (isValidPlacement(col, row)) {
            const stats = TOWER_TYPES[gameState.selectedTower];
            
            // 绘制范围圈
            ctx.beginPath();
            ctx.arc(col * TILE_SIZE + TILE_SIZE/2, row * TILE_SIZE + TILE_SIZE/2, stats.range, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.stroke();

            // 绘制塔的预览
            ctx.fillStyle = stats.color;
            ctx.globalAlpha = 0.6;
            ctx.fillRect(col * TILE_SIZE + 5, row * TILE_SIZE + 5, TILE_SIZE - 10, TILE_SIZE - 10);
            ctx.globalAlpha = 1.0;
        }
    }
}

function isValidPlacement(col, row) {
    // 检查边界
    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return false;
    
    // 检查是否在路径上 (简单的距离检查，虽然path数组是离散的，但为了严谨)
    for (let p of gameState.path) {
        // 如果点击的格子正好是路径上的格子，或者是路径连接处
        if (Math.abs(p.x - col) < 1 && Math.abs(p.y - row) < 1) return false;
    }

    // 检查是否已有塔
    for (let t of gameState.towers) {
        if (t.col === col && t.row === row) return false;
    }

    return true;
}

function placeTower(col, row) {
    const towerType = gameState.selectedTower;
    const cost = TOWER_TYPES[towerType].cost;

    if (gameState.money >= cost && isValidPlacement(col, row)) {
        gameState.money -= cost;
        gameState.towers.push(new Tower(col, row, towerType));
        updateHUD();
        createParticles(col * TILE_SIZE + TILE_SIZE/2, row * TILE_SIZE + TILE_SIZE/2, '#ecf0f1', 8);
    } else if (gameState.money < cost) {
        showToast("金钱不足！");
    } else {
        showToast("无效的位置！");
    }
}

/**
 * 主循环
 */
function loop() {
    if (!gameState.isPlaying) return;

    // 清屏
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 绘制地图
    drawMap();

    // 更新逻辑
    updateWaveLogic();

    // 更新并绘制敌人
    for (let i = gameState.enemies.length - 1; i >= 0; i--) {
        const enemy = gameState.enemies[i];
        enemy.update();
        enemy.draw();
        if (enemy.health <= 0) {
            gameState.enemies.splice(i, 1);
        }
    }

    // 更新并绘制塔
    gameState.towers.forEach(tower => {
        tower.update();
        tower.draw();
    });

    // 更新并绘制投射物
    for (let i = gameState.projectiles.length - 1; i >= 0; i--) {
        const p = gameState.projectiles[i];
        p.update();
        p.draw();
        if (!p.active) {
            gameState.projectiles.splice(i, 1);
        }
    }

    // 更新并绘制粒子
    for (let i = gameState.particles.length - 1; i >= 0; i--) {
        const p = gameState.particles[i];
        p.update();
        p.draw();
        if (p.life <= 0) {
            gameState.particles.splice(i, 1);
        }
    }

    // 绘制 UI 辅助 (网格和鼠标预览)
    drawGridAndPreview(mouseX, mouseY);

    gameState.frameCount++;
    requestAnimationFrame(loop);
}

/**
 * 交互与 UI 逻辑
 */
let mouseX = 0;
let mouseY = 0;

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
});

canvas.addEventListener('click', (e) => {
    if (!gameState.isPlaying) return;
    
    const col = Math.floor(mouseX / TILE_SIZE);
    const row = Math.floor(mouseY / TILE_SIZE);
    placeTower(col, row);
});

function selectTower(type) {
    gameState.selectedTower = type;
    // 更新 UI 按钮状态
    document.querySelectorAll('.tower-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`btn-${type}`).classList.add('active');
}

function updateHUD() {
    document.getElementById('lives-display').innerText = gameState.lives;
    document.getElementById('money-display').innerText = gameState.money;
    document.getElementById('wave-display').innerText = `第 ${gameState.wave} 波`;

    // 更新按钮可用状态
    for (let type in TOWER_TYPES) {
        const btn = document.getElementById(`btn-${type}`);
        btn.disabled = gameState.money < TOWER_TYPES[type].cost;
    }
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.style.opacity = 1;
    setTimeout(() => {
        toast.style.opacity = 0;
    }, 2000);
}

function startGame() {
    document.getElementById('start-screen').classList.add('hidden');
    initGame();
}

function resetGame() {
    document.getElementById('game-over-screen').classList.add('hidden');
    initGame();
}

function initGame() {
    gameState = {
        lives: 20,
        money: 120,
        wave: 1,
        isPlaying: true,
        selectedTower: 'basic',
        enemies: [],
        towers: [],
        projectiles: [],
        particles: [],
        path: [],
        waveInProgress: false,
        enemiesToSpawn: 0,
        spawnTimer: 0,
        frameCount: 0
    };
    initPath();
    updateHUD();
    
    // 启动波次
    setTimeout(spawnWave, 1000);
    
    loop();
}

function endGame() {
    gameState.isPlaying = false;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('end-score').innerText = `生存波数: ${gameState.wave}`;
}

// 初始绘制一次背景
ctx.fillStyle = '#27ae60';
ctx.fillRect(0,0, canvas.width, canvas.height);
</script>
</body>
</html>
